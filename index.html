<style>
/* Layout: 시험지 한 장 = 한 화면. 가운데 좁은 답안 카드, 위에 진행 막대, 아래에 해설 */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#18212b; --muted:#5d6874; --line:#d5dbe2;
  --accent:#1f4e79; --accent-soft:#e3ecf5; --ok:#1d7a4c; --ok-soft:#e2f3ea; --bad:#b4372f; --bad-soft:#f9e4e2;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif; --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --paper:#1a2129; --ink:#e6ebf0; --muted:#98a3ae; --line:#2e3843;
  --accent:#8db8e0; --accent-soft:#1f2f40; --ok:#6fcf9b; --ok-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --paper:#1a2129; --ink:#e6ebf0; --muted:#98a3ae; --line:#2e3843;
  --accent:#8db8e0; --accent-soft:#1f2f40; --ok:#6fcf9b; --ok-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.15rem}
.meta{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:28px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:18px}
.tag{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;letter-spacing:.02em;color:var(--muted)}
.tag span{background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px}
.qn{font-family:var(--f-mono);color:var(--accent);font-size:.9rem}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.4}
h2.q{font-size:1.22rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:inherit;background:var(--paper);
  border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;margin-top:1px}
.opt span:last-child{min-width:0}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .n{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.fb{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.verdict{font-weight:600;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.exp{color:var(--ink);margin:0}
.exp b{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 20px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--accent)}
.hint{font-size:.8rem;color:var(--muted)}
.score{font-family:var(--f-display);font-size:3rem;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.cell{font-family:var(--f-mono);font-size:.8rem;text-align:center;padding:6px 0;border-radius:6px;border:1px solid var(--line);cursor:pointer;background:var(--paper);color:var(--ink)}
.cell.o{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .cell.x{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.lead{color:var(--muted);margin:0}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.why li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;padding:8px 10px;border-radius:6px;background:var(--bg)}
.why li.c{background:var(--ok-soft)}
.why li.p{outline:1.5px solid var(--bad)}
.why .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;border:1.5px solid var(--muted);color:var(--muted)}
.why li.c .n{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.why li span:last-child{min-width:0}
.sub{font-weight:600;font-size:.88rem;color:var(--accent);margin:4px 0 0}
.switch{font:inherit;font-size:.82rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:4px 12px;cursor:pointer}
.switch:hover{border-color:var(--accent)}
.switch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.study{border-top:1px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.inp{font:inherit;font-weight:400;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.inp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.calc{margin:0;font-size:.92rem;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px}
.calc.err{background:var(--bad-soft);color:var(--bad)}
.cnt{display:flex;gap:12px;align-items:center;font-weight:400}
.cnt input{flex:1;min-width:0;accent-color:var(--accent)}
.cnt output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const SET = {"title": "미디어교육지도사 모의고사", "range": "1~200쪽", "sets": [{"name": "1회차", "questions": [{"p": "9-10", "s": "제1부 1장 커뮤니케이션", "q": "커뮤니케이션의 구성요소 중 '잡음(Noise)'에 대한 설명으로 옳지 않은 것은?", "o": ["공사 소음으로 강의 설명이 잘 들리지 않는 것은 물리적 잡음이다.", "잡음은 수신자의 해석을 풍부하게 하므로 효과적인 의사소통을 위해 적절히 늘려야 한다.", "외국 학생이 모국어가 아닌 한국어 수업을 들으며 겪는 어려움은 의미적 잡음이다.", "학생의 잡념으로 설명이 정확히 전달되지 못하는 것은 심리적 잡음이다."], "a": 1, "e": "잡음은 정보 왜곡이나 해석 오류를 초래하는 방해 요소이므로 효과적인 의사소통을 위해서는 '최소화'가 중요하다. 교재는 물리적·심리적·의미적 잡음의 예를 각각 공사소음, 학생의 잡념, 외국 학생의 언어 장벽으로 제시한다.", "w": ["맞는 설명. 공사소음처럼 외부 환경에서 생기는 방해는 물리적 잡음이다.", "틀린 설명(정답). 잡음은 정보 왜곡·해석 오류를 낳으므로 '최소화'해야 한다.", "맞는 설명. 언어·의미 해석의 어려움은 의미적 잡음이다.", "맞는 설명. 수신자 내부의 잡념은 심리적 잡음이다."]}, {"p": "11-12", "s": "제1부 1장 커뮤니케이션", "q": "커뮤니케이션 모델에 대한 설명으로 옳은 것은?", "o": ["우드의 모델은 행동주의 시각에서 커뮤니케이션을 메시지 전달 과정으로만 보았다.", "라스웰의 모델은 '효과'보다 '의미'를 중시하며 쌍방향성을 잘 설명한다.", "슈람의 모델은 송신자와 수신자를 완벽히 분리한 단선형 모델이다.", "쉐넌과 위버의 모델은 신호 전달을 방해하는 '잡음' 개념을 도입했으며, 메시지를 정보의 '양'으로 보았다."], "a": 3, "e": "쉐넌과 위버(1949)의 수학적 이론은 메시지를 '의미'보다 정보·자료의 '양'으로 보고, 잡음(noise) 개념을 도입했다. 라스웰은 의미보다 효과를 중시하며 쌍방향성을 설명하지 못하고, 슈람은 상호작용 모델, 우드는 구성주의 시각의 교류 모델이다.", "w": ["틀린 설명. 우드는 '구성주의' 시각의 교류 모델로, 커뮤니케이션이 신뢰·정체성 등을 만들어 낸다고 보았다.", "틀린 설명. 라스웰 모델은 의미보다 '효과'를 중시하고, 송수신자가 분리되어 쌍방향성을 설명하지 못한다.", "틀린 설명. 슈람은 단선형이 아니라 쌍방향 '상호작용 모델'이다.", "옳은 설명(정답). 쉐넌과 위버는 잡음 개념을 도입했고 메시지를 정보의 '양'으로 보았다."]}, {"p": "12", "s": "제1부 1장 커뮤니케이션", "q": "W. 슈람의 커뮤니케이션 모델에서 '공유된 경험만이 실제 커뮤니케이션이 발생하는 부분이며, 공통영역이 클수록 원활하다'고 설명한 핵심 개념은?", "o": ["게이트키핑", "경험의 장(field of experience)", "미디어 의존", "부호화 오류"], "a": 1, "e": "슈람의 두 번째 모델은 신호를 통해 의미를 공유하고 '경험의 장'의 공통영역을 찾아가는 과정을 그렸다. 공통영역이 클수록 더 원활하고 효과적인 커뮤니케이션이 이루어진다.", "w": ["오답. 게이트키핑은 뉴스 선택 과정에 관한 개념으로 이 단원의 슈람 모델 내용이 아니다.", "정답. 슈람의 두 번째 모델은 송수신자의 '경험의 장'이 겹치는 공통영역에서 커뮤니케이션이 일어난다고 보았다.", "오답. 미디어 의존은 슈람 모델과 관계없는 개념이다.", "오답. 부호화는 커뮤니케이션 과정의 한 요소일 뿐, 공통영역 개념을 가리키지 않는다."]}, {"p": "16-18", "s": "제1부 1장 커뮤니케이션", "q": "비언어적 커뮤니케이션에 대한 설명으로 옳지 않은 것은?", "o": ["수어(수화)는 손동작을 사용하므로 대표적인 비언어적 커뮤니케이션에 해당한다.", "시간의 사용과 해석을 연구하는 분야를 크로네믹스(Chronemics)라고 한다.", "인류학자 홀(Hall)의 분류에서 '사적 거리'는 약 45~120cm이다.", "교사가 수업 시작 때 책을 펴 학생들의 잡담을 멈추게 하는 것은 '조절기능'이다."], "a": 0, "e": "교재는 무음으로 진행될 때 '수화가 언어적 커뮤니케이션에 포함된다'고 설명한다. 수어는 상징이 구조화된 언어 체계이므로 언어적 커뮤니케이션이다. (공간학=프록시믹스, 신체언어 연구=키네식스, 촉각=햅틱스도 함께 기억)", "w": ["틀린 설명(정답). 수어는 상징이 구조화된 언어 체계로 '언어적' 커뮤니케이션에 포함된다.", "맞는 설명. 시간학은 크로네믹스, 공간학은 프록시믹스이다.", "맞는 설명. 홀의 분류에서 사적 거리는 45~120cm이다(친밀 45cm 이내, 사회적 120~360cm, 공적 360cm 이상).", "맞는 설명. 책을 펴 잡담을 멈추게 하는 것은 상호작용의 틀을 조절하는 '조절기능'이다."]}, {"p": "19-23", "s": "제1부 1장 커뮤니케이션", "q": "커뮤니케이션 유형에 대한 설명으로 옳은 것은?", "o": ["대인 커뮤니케이션은 메시지의 의도성·계획성이 높고 피드백이 적다.", "소집단 커뮤니케이션 네트워크 중 '수레바퀴(wheel)형'은 리더 없이 모든 구성원이 서로 직접 소통한다.", "아리스토텔레스는 공중 연설의 3요소로 로고스(논리), 파토스(감성), 에토스(화자의 신뢰성·성품)를 제시했다.", "매스 커뮤니케이션의 수신자는 서로 유대감이 강한 능동적 집단으로 피드백이 풍부하다."], "a": 2, "e": "공중 커뮤니케이션은 아리스토텔레스 수사학에서 시작되었고, 3대 요소는 로고스·파토스·에토스다. 대인 커뮤니케이션은 의도성·계획성이 적고 피드백이 풍부하며, 수레바퀴형은 중앙 집중형, 리더 없이 모두 소통하는 것은 개방(all-channel)형이다. 매스 커뮤니케이션의 대중은 원자화되고 유대감이 약한 수동적 존재로 피드백이 적다.", "w": ["틀린 설명. 대인 커뮤니케이션은 친밀한 관계라 의도성·계획성이 적고 피드백이 풍부하다.", "틀린 설명. 수레바퀴형은 중앙의 한 사람이 모두와 소통하는 중앙 집중형이다. 리더 없이 모두 소통하는 것은 개방형이다.", "옳은 설명(정답). 공중 연설의 3요소는 로고스(논리)·파토스(감성)·에토스(화자의 신뢰성)이다.", "틀린 설명. 매스 커뮤니케이션의 대중은 익명·원자화되어 유대감이 약한 수동적 존재로 피드백이 적다."]}, {"p": "31", "s": "제1부 2장 미디어의 기능과 효과", "q": "미디어 연대기에 대한 설명으로 옳지 않은 것은?", "o": ["1456년 구텐베르크의 금속활자 발명 이후 신문이라는 최초의 매스 커뮤니케이션이 등장했다.", "우리나라 최초의 근대신문은 1896년 창간된 '독립신문'이다.", "퓰리처의 '뉴욕 월드'와 허스트의 '뉴욕 저널'의 경쟁은 황색 저널리즘의 대표 사례이다.", "1833년 '더 뉴욕 선'이 저렴한 페니 프레스를 등장시키며 대중 신문의 시대가 열렸다."], "a": 1, "e": "교재는 1883년 창간된 '한성순보'를 우리나라 최초의 근대신문으로 제시한다. 세계 최초 일간지는 1650년 독일 라이프치히의 '아이코멘데 차이퉁'이다.", "w": ["맞는 설명. 금속활자 이후 신문이 최초의 매스 커뮤니케이션으로 등장했다.", "틀린 설명(정답). 교재는 1883년 창간된 '한성순보'를 우리나라 최초의 근대신문으로 제시한다.", "맞는 설명. 퓰리처와 허스트의 경쟁이 황색 저널리즘을 대표한다.", "맞는 설명. 1833년 더 뉴욕 선의 페니 프레스로 대중 신문 시대가 열렸다."]}, {"p": "33-34", "s": "제1부 2장 미디어의 기능과 효과", "q": "로저 F. 피들러(Roger F. Fidler)의 '미디어 모포시스(Media Morphosis)'에 대한 설명으로 옳은 것은?", "o": ["뉴미디어와 올드 미디어는 서로 의존·공존하며 서로의 특성을 흡수하여 함께 진화한다.", "뉴미디어가 등장하면 올드 미디어는 상대적 이점을 잃고 완전히 대체된다.", "미디어 효과는 사회경제적 지위에 따라 불균등하게 나타난다.", "미디어는 메시지를 전달하는 중립적 도구에 불과하다."], "a": 0, "e": "미디어 모포시스는 뉴미디어가 기존 미디어의 점진적 변형을 통해 생겨나고, 올드 미디어도 뉴미디어의 기술과 혁신을 흡수해 함께 진화하여 미디어 생태계가 확장된다고 본다. '사회경제적 지위에 따라 불균등' 보기는 지식격차가설의 설명이다.", "w": ["옳은 설명(정답). 미디어 모포시스는 뉴미디어와 올드 미디어가 서로 의존·공존하며 함께 진화한다고 본다.", "틀린 설명. 기존 미디어는 신뢰성·접근성·익숙함 같은 상대적 이점이 있어 사라지지 않고 공존한다.", "틀린 설명. 사회경제적 지위에 따른 정보 습득 차이는 티치노의 지식격차가설이다.", "틀린 설명. 미디어를 단순한 도구로 보는 시각은 피들러의 주장이 아니다."]}, {"p": "35-37", "s": "제1부 2장 미디어의 기능과 효과", "q": "사회의 주요 이슈가 발생했을 때 미디어가 그 의미를 해석하고 대응책을 제시하여 사회적 갈등을 조정하는 기능은?", "o": ["오락 제공", "환경감시", "상관조정", "사회통합"], "a": 2, "e": "상관조정 기능은 정보의 의미를 해석·비평하고 해결책을 제시함으로써 사회적 갈등을 조정하는 기능이다. 환경감시는 언론이 '제4의 권부'로서 권력을 감시하는 감시견 기능을 말한다.", "w": ["오답. 오락 제공은 즐거움과 스트레스 해소를 주는 기능이다.", "오답. 환경감시는 언론이 '제4의 권부'로서 권력을 감시하는 감시견 기능이다.", "정답. 상관조정은 의미를 해석·비평하고 해결책을 제시해 사회적 갈등을 조정하는 기능이다.", "오답. 사회통합은 위기 때 개인과 사회를 결속시키는 기능이다(금모으기 운동 사례)."]}, {"p": "38", "s": "제1부 2장 미디어의 기능과 효과", "q": "한국지능정보사회진흥원(2024)이 제시한 스마트폰 과의존 3요인에 해당하지 않는 것은?", "o": ["현저성(salience)", "조절실패(self-control failure)", "내성(tolerance)", "문제적 결과(serious consequences)"], "a": 2, "e": "스마트폰 과의존 3요인은 (1)  조절실패 (2)  현저성 (3)  문제적 결과이다. 현저성은 스마트폰 이용이 생활에서 가장 두드러지고 중요한 활동이 되는 것을 말한다.", "w": ["해당함. 현저성은 스마트폰 이용이 생활에서 가장 두드러지고 중요한 활동이 되는 것이다.", "해당함. 조절실패는 주관적 목표 대비 스마트폰 이용을 스스로 조절하는 능력이 떨어지는 것이다.", "해당하지 않음(정답). '내성'은 교재의 스마트폰 과의존 3요인에 포함되지 않는다.", "해당함. 문제적 결과는 부정적 결과를 겪으면서도 계속 이용하는 것이다."]}, {"p": "45-46", "s": "제1부 2장 미디어의 기능과 효과", "q": "이슈나 사건의 전개과정을 기술·묘사하는 데 초점을 둔 보도 프레임과, 맥락·배경 등 해석과 분석을 강조하는 프레임을 순서대로 바르게 짝지은 것은? (Iyengar, 1991)", "o": ["일화적 프레임 – 주제적 프레임", "귀인 프레임 – 가치 프레임", "정황 프레임 – 배경 프레임", "주제적 프레임 – 일화적 프레임"], "a": 0, "e": "아이엔가(Iyengar)는 사건의 전개과정 묘사에 초점을 둔 '일화적 프레임(Episodic)'과 맥락·배경 분석을 강조하는 '주제적 프레임(Thematic)'으로 구분했다.", "w": ["정답. 전개과정 묘사는 일화적(Episodic), 맥락·배경 분석은 주제적(Thematic) 프레임이다.", "오답. 귀인·가치 프레임은 김원용·이동훈(2005)의 프레임 유형화 개념이다.", "오답. 정황·배경 프레임 역시 김원용·이동훈의 유형으로 아이엔가의 구분이 아니다.", "오답. 순서가 반대이다. 전개과정 묘사가 일화적, 맥락·배경 분석이 주제적 프레임이다."]}, {"p": "46-48", "s": "제1부 2장 미디어의 기능과 효과", "q": "미디어 효과 이론과 주창자/핵심 내용의 연결이 옳지 않은 것은?", "o": ["문화계발이론 – 거브너 – TV를 많이 볼수록 TV가 묘사하는 방식대로 현실을 인식한다.", "의제설정이론 – 맥콤스 – 미디어 의제가 공중 의제에 영향을 미친다.", "침묵의 나선이론 – 노엘-노이만 – 자신의 의견이 소수라고 생각할수록 침묵하는 경향이 있다.", "제3자효과 – 데이비슨 – 공익광고처럼 바람직한 메시지일수록 타인이 더 영향을 받는다고 지각한다."], "a": 3, "e": "제3자효과는 메시지가 사회적으로 바람직하지 못할 때 더 크게 나타난다. 공익광고처럼 바람직한 메시지는 오히려 자신이 더 영향을 받는다고 지각하는 '제1자 효과'가 나타나는 경우가 많다. (문화계발이론의 공명효과·주류화효과, 티치노의 지식격차가설도 함께 기억)", "w": ["맞는 연결. 거브너의 문화계발이론이며 공명효과·주류화효과도 함께 다룬다.", "맞는 연결. 맥콤스의 의제설정이론은 미디어 의제가 공중 의제에 영향을 준다고 본다.", "맞는 연결. 노엘-노이만의 침묵의 나선이론은 고립에 대한 두려움으로 소수 의견이 침묵한다고 본다.", "틀린 연결(정답). 공익광고처럼 바람직한 메시지에서는 자신이 더 영향받는다고 보는 '제1자 효과'가 나타난다."]}, {"p": "55", "s": "제1부 3장 미디어 산업", "q": "방송 산업에 대한 설명으로 옳지 않은 것은?", "o": ["방송 산업은 크게 광고 수익 기반의 지상파 방송과 수신료 수익 기반의 유료방송으로 구분된다.", "유료방송 플랫폼은 종합유선방송사업자(SO), 위성방송사업자, IPTV 사업자로 구분할 수 있다.", "KBS와 EBS는 수신료를 재원으로 활용한다.", "방송채널사용사업자(PP)는 가입자에게 받는 수신료를 유일한 재원으로 삼는다."], "a": 3, "e": "지상파 방송사업자와 방송채널사용사업자(PP) 같은 방송콘텐츠 사업자는 '광고'를 주요 재원으로 삼는다. 가입자 수신료가 재원의 기반이 되는 것은 SO·위성·IPTV 같은 유료방송 '플랫폼'이다.", "w": ["맞는 설명. 방송 산업은 광고 기반 지상파와 수신료 기반 유료방송으로 나뉜다.", "맞는 설명. 유료방송 플랫폼은 SO, 위성방송, IPTV 사업자로 구분된다.", "맞는 설명. KBS·EBS는 수신료를 재원으로 활용한다.", "틀린 설명(정답). PP 같은 방송콘텐츠 사업자의 주 재원은 '광고'이며, 수신료 기반은 유료방송 플랫폼이다."]}, {"p": "55-56", "s": "제1부 3장 미디어 산업", "q": "「신문 등의 진흥에 관한 법률」에 따른 신문 분류에 대한 설명으로 옳은 것은?", "o": ["열독률은 특정 신문을 유료로 구독하는 가구의 비율이다.", "일간신문은 격일 또는 주 3회 이상 발행하는 신문이다.", "신문은 같은 명칭으로 월 1회 이상 발행하는 간행물이다.", "주간신문은 주 3회 이상 발행하는 신문이다."], "a": 1, "e": "신문은 같은 명칭으로 월 2회 이상 발행하는 간행물이며, 일간신문은 격일 또는 주 3회 이상, 주간신문은 주 2회 또는 월 2회 이상 발행한다. 유료 구독 가구 비율은 '구독률'이고, 열독률은 회독자를 포함해 신문에 노출된 수용자 비율이다.", "w": ["틀린 설명. 유료 구독 가구 비율은 '구독률'이고, 열독률은 회독자까지 포함한 노출 비율이다.", "옳은 설명(정답). 일간신문은 격일 또는 주 3회 이상 발행한다.", "틀린 설명. 신문은 같은 명칭으로 '월 2회 이상' 발행하는 간행물이다.", "틀린 설명. 주간신문은 주 2회 또는 월 2회 이상 발행하는 신문이다."]}, {"p": "59-60", "s": "제1부 3장 미디어 산업", "q": "하나의 영화를 극장 → IPTV/VOD → OTT → TV 방송 순으로 시차를 두고 다른 미디어를 통해 유통하여 부가가치를 높이는 미디어 산업의 특징은?", "o": ["양면 시장", "범위의 경제", "창구효과(window effect)", "문화적 할인"], "a": 2, "e": "창구효과는 하나의 콘텐츠를 서로 다른 시점에 서로 다른 미디어로 유통하여 부가가치를 높이는 전략적 유통 방식이다. 시차별·미디어별·지역별로 차별화된 가격을 통해 가치를 창출한다.", "w": ["오답. 양면 시장은 이용자와 광고주 두 시장을 동시에 상대하는 구조이다.", "오답. 범위의 경제는 한 기업이 여러 제품을 함께 생산할 때 비용이 더 적게 드는 것이다.", "정답. 시점·미디어를 달리해 유통하며 부가가치를 높이는 것이 창구효과이다.", "오답. 문화적 할인은 다른 문화권에서 소비될 때 가치가 손실되는 현상이다."]}, {"p": "59-60", "s": "제1부 3장 미디어 산업", "q": "미디어 상품의 경제적 특성에 대한 설명으로 옳지 않은 것은?", "o": ["문화적 할인: 다른 문화권에서 소비될 때 언어·문화적 맥락 차이로 가치 손실이 발생한다.", "네트워크 외부효과: 네트워크 규모가 커질수록 네트워크의 가치가 감소한다.", "규모의 경제: 초판비용은 크지만 추가 이용자에 대한 복제·배급비용은 거의 들지 않는다.", "경험재: 직접 경험하기 전에는 가치를 알기 어려워 리뷰 등을 참고한다."], "a": 1, "e": "네트워크 외부효과는 네트워크 규모가 커질수록 네트워크 가치가 '증가'하는 것이다. 이용자가 많아질수록 상품 가치가 높아지는 선순환 구조가 만들어진다.", "w": ["맞는 설명. 언어·관습 차이로 다른 문화권에서 가치가 줄어드는 것이 문화적 할인이다.", "틀린 설명(정답). 네트워크 외부효과는 규모가 커질수록 가치가 '증가'하는 것이다.", "맞는 설명. 초판비용은 크고 복제·배급비용은 거의 없어 규모의 경제가 나타난다.", "맞는 설명. 경험재는 사용 전 가치를 알기 어려워 리뷰를 참고한다."]}, {"p": "63-65", "s": "제1부 3장 미디어 산업", "q": "미디어 산업 생태계의 C-P-N-D 구조에서 '네트워크(Network)'형 중심 사업자에 해당하는 것은?", "o": ["지상파 방송, CP, MPP", "OTT, 앱 마켓, 인터넷 포털", "통신사업자, 케이블·위성사업자", "PC·모바일·TV 제조사, 셋톱박스 제공업자"], "a": 2, "e": "C-P-N-D는 콘텐츠-플랫폼-네트워크-디바이스를 뜻한다. 네트워크형 중심 사업자는 통신사업자, 케이블·위성사업자이다. 지상파·CP·MPP는 콘텐츠형, OTT·앱 마켓·포털은 플랫폼형, 제조사·셋톱박스 제공업자는 디바이스형 사업자이다.", "w": ["오답. 지상파·CP·MPP는 직접 제작에 참여하는 '콘텐츠형' 사업자이다.", "오답. OTT·앱 마켓·포털은 '플랫폼형' 사업자이다.", "정답. 통신사업자와 케이블·위성사업자가 '네트워크형' 사업자이다.", "오답. 제조사와 셋톱박스 제공업자는 '디바이스형' 사업자이다."]}, {"p": "66", "s": "제1부 3장 미디어 산업", "q": "미디어 발전단계(미디어 1.0 → 2.0 → 3.0)에 대한 설명으로 옳은 것은?", "o": ["미디어 2.0은 N스크린, 양방향 콘텐츠 흐름이 특징이다.", "미디어 1.0의 이용자 소비행태는 'Move Forward'이다.", "미디어 3.0은 단일스크린(TV 수상기 중심)이 특징이다.", "새로운 단계의 미디어는 이전 단계의 미디어를 완전히 대체한다."], "a": 0, "e": "미디어 1.0은 단방향·Lean Back·단일스크린, 미디어 2.0은 양방향·Move Forward·N스크린, 미디어 3.0은 지능형 양방향·Jump in Tele-presence·B스크린(Beyond Screen)이 특징이다. 각 단계는 이전 단계를 대체하기보다 공존하며 발전한다.", "w": ["옳은 설명(정답). 미디어 2.0은 양방향 콘텐츠 흐름과 N스크린이 특징이다.", "틀린 설명. 'Move Forward'는 미디어 2.0이고, 미디어 1.0은 'Lean Back'이다.", "틀린 설명. 단일스크린은 미디어 1.0이고, 미디어 3.0은 B스크린(Beyond Screen)이다.", "틀린 설명. 각 단계는 이전 미디어를 대체하기보다 공존하며 발전한다."]}, {"p": "73-78", "s": "제1부 3장 미디어 산업", "q": "미디어 산업의 영향력에 대한 설명으로 옳지 않은 것은?", "o": ["문화제국주의는 한 나라의 고유문화가 다른 나라의 자본·기술·문화상품 등의 영향으로 심각하게 훼손되는 것을 말한다.", "콘텐츠 산업의 취업유발계수는 반도체 산업보다 높다.", "강화이론은 인터넷이 정치에 무관심한 유권자까지 정치 영역으로 동원한다고 본다.", "기후 저널리즘은 기후변화 보도에서 장기적 관점의 융합적 시각을 요구한다."], "a": 2, "e": "인터넷이 개인을 정치 영역으로 '동원'한다는 것은 '동원이론'이다. 강화이론은 뉴미디어가 기존 신념을 강화할 뿐, 이미 관심 있는 유권자를 더 참여시키고 무관심한 유권자를 동원하지는 못한다고 본다. (콘텐츠 산업 취업유발계수 14명 vs 반도체 2.1명)", "w": ["맞는 설명. 문화제국주의는 외부 영향으로 고유문화가 훼손되는 것이다.", "맞는 설명. 콘텐츠 산업 취업유발계수는 14명으로 반도체(2.1명)의 약 7배이다.", "틀린 설명(정답). 인터넷이 무관심한 유권자까지 동원한다는 것은 '동원이론'이다. 강화이론은 기존 성향을 강화할 뿐이라고 본다.", "맞는 설명. 기후 저널리즘은 장기적·융합적 시각을 요구한다."]}, {"p": "85", "s": "제1부 4장 미디어 관련 법제", "q": "미디어를 둘러싼 법률관계의 당사자와 그가 가지는 대표적 권리의 연결로 옳지 않은 것은?", "o": ["미디어 회사 – 표현의 자유, 보도의 자유", "미디어 이용자 – 알 권리", "보도 대상자 – 정정보도청구권, 반론보도청구권, 추후보도청구권", "미디어 이용자 – 헌법상 명문으로 보장된 일반적 언론매체이용권"], "a": 3, "e": "미디어 이용자의 '일반적인 언론매체이용권'은 인정 여부에 관해 견해가 대립(다투어짐)하는 권리이며 헌법에 명시된 권리가 아니다. 보도 대상자는 인격권과 권리구제형 언론매체이용권(정정·반론·추후보도청구권)을 가진다.", "w": ["맞는 연결. 미디어 회사는 헌법 제21조의 표현의 자유와 보도의 자유를 가진다.", "맞는 연결. 미디어 이용자는 헌법상 알 권리를 가진다.", "맞는 연결. 보도 대상자는 인격권과 정정·반론·추후보도청구권을 가진다.", "틀린 연결(정답). 일반적 언론매체이용권은 인정 여부를 두고 견해가 대립하며 헌법에 명시되어 있지 않다."]}, {"p": "86-87", "s": "제1부 4장 미디어 관련 법제", "q": "표현의 자유의 제한에 대한 설명으로 옳지 않은 것은?", "o": ["명확성의 원칙은 기본권 제한의 목적과 수단 사이의 관계가 지나치지 않아야 한다는 원칙이다.", "헌법 제37조 제2항에 따라 국가안전보장·질서유지·공공복리를 위해 필요한 경우 법률로써 제한할 수 있다.", "기본권을 제한하는 경우에도 자유와 권리의 본질적인 내용은 침해할 수 없다.", "헌법 제21조 제2항은 언론·출판에 대한 허가나 검열을 금지한다."], "a": 0, "e": "목적과 수단의 관계가 지나치지 않아야 한다는 것은 '과잉금지 원칙'이다. 명확성의 원칙은 기본권을 제한하는 법률을 명확한 용어로 규정해야 한다는 원칙으로, 불명확하면 '위축효과(chilling effect)'를 낳는다.", "w": ["틀린 설명(정답). 목적과 수단의 관계를 보는 것은 '과잉금지 원칙'이다. 명확성의 원칙은 법률을 명확한 용어로 규정하라는 원칙이다.", "맞는 설명. 헌법 제37조 제2항의 일반적 법률유보 내용이다.", "맞는 설명. 기본권 제한에도 본질적 내용은 침해할 수 없다(기본권 제한의 한계).", "맞는 설명. 헌법 제21조 제2항은 언론·출판의 허가·검열과 집회·결사의 허가를 금지한다."]}, {"p": "89", "s": "제1부 4장 미디어 관련 법제", "q": "공적 인물(public figure)의 사생활이 공적 생활의 내용을 이룰 때 일반인보다 인격권의 보호 범위가 줄어든다고 보는 이론과 그 근거로 옳은 것은?", "o": ["공적 인물 이론 – 국민의 알 권리", "실제적 조화의 원칙 – 헌법의 통일성", "이익형량의 원칙 – 표현의 자유의 우월적 지위", "매체특성적 접근 – 전파의 희소성"], "a": 0, "e": "'공적 인물 이론'에 따르면 공적 사항에 관해서는 국민에게 알 권리가 있으므로 공적 인물의 인격권 보호 범위가 줄어든다. 단, 공적 관련성이 없는 사항까지 단지 공적 인물이라는 이유로 축소되어서는 안 된다.", "w": ["정답. 공적 인물 이론은 공적 사항에 대한 국민의 알 권리를 근거로 인격권 보호 범위를 줄인다.", "오답. 실제적 조화의 원칙은 상충하는 기본권을 모두 최대한 실현하도록 조정하는 원칙이다.", "오답. 이익형량은 양자택일 상황에서 더 큰 이익을 따지는 원칙이며, 언론의 자유가 항상 우월한 것도 아니다.", "오답. 매체특성적 접근은 미디어 특성별로 규율을 달리하는 방법론이다."]}, {"p": "90", "s": "제1부 4장 미디어 관련 법제", "q": "「언론중재 및 피해구제 등에 관한 법률」상 권리구제형 언론매체이용권에 대한 설명으로 옳은 것은?", "o": ["반론보도청구권은 사실적 주장에 관한 언론보도 등으로 피해를 입은 자가 그 보도 내용에 관한 반론보도를 청구하는 권리이다.", "권리구제형 언론매체이용권은 일반적 언론매체이용권과 같은 개념이다.", "추후보도청구권은 보도 내용이 진실하지 아니한 경우 언제든지 청구할 수 있다.", "정정보도청구권은 언론보도가 있은 날부터 6개월 이내에만 청구할 수 있다."], "a": 0, "e": "반론보도청구권(제16조)은 사실적 주장에 관한 보도로 피해를 입은 자가 반론보도를 청구하는 권리이다. 정정보도청구권은 보도가 있음을 '안 날부터 3개월 이내', 추후보도청구권은 형사절차가 무죄 등으로 종결된 사실을 안 날부터 3개월 이내에 청구한다.", "w": ["옳은 설명(정답). 반론보도청구권(제16조)의 내용이다.", "틀린 설명. '권리구제형'이라는 이름 자체가 일반적 언론매체이용권과 구별하기 위한 것이다.", "틀린 설명. 추후보도청구는 형사절차가 무죄 등으로 종결된 사실을 안 날부터 3개월 이내에 한다.", "틀린 설명. 정정보도청구는 보도가 있음을 '안 날부터 3개월 이내'에 해야 한다."]}, {"p": "90-91", "s": "제1부 4장 미디어 관련 법제", "q": "매체특성적 접근 방법에 따른 미디어 규율에 대한 설명으로 옳은 것은?", "o": ["지상파방송사업자 주식 소유 제한은 대표적인 '내용 규율'에 해당한다.", "인쇄 미디어는 진입을 어렵게 하고 내용 규율을 강하게 한다.", "방송은 전파의 희소성·침투성을 근거로 특허(허가)로 진입하게 하고, 공익성을 근거로 내용 규율을 인쇄 미디어보다 강하게 한다.", "통신은 통신의 비밀과 자유에도 불구하고 내용 규제를 가장 강하게 한다."], "a": 2, "e": "인쇄 미디어는 진입이 쉽고 내용 규율은 원칙적으로 하지 않는다. 방송은 전파의 희소성·침투성으로 특허(허가)로 진입하고 내용 규율이 강하다. 통신은 자연독점을 근거로 허가·특허로 진입하되 통신의 비밀과 자유를 근거로 원칙적으로 내용 규제를 하지 않는다. 주식 소유 제한은 '구조 규율'이다.", "w": ["틀린 설명. 주식 소유 제한은 소유·시장질서를 다루는 '구조 규율'이다.", "틀린 설명. 인쇄 미디어는 진입이 쉽고 내용 규율을 원칙적으로 하지 않는다.", "옳은 설명(정답). 방송은 전파의 희소성·침투성으로 허가 진입, 공익성으로 강한 내용 규율을 받는다.", "틀린 설명. 통신은 통신의 비밀과 자유를 근거로 원칙적으로 내용 규제를 하지 않는다."]}, {"p": "99-101", "s": "제1부 4장 미디어 관련 법제", "q": "미디어교육 관련 근거 법률과 소관 부처/내용의 연결로 옳지 않은 것은?", "o": ["「지능정보화 기본법」 – 정보격차 해소, 과의존 예방·해소 교육 – 과학기술정보통신부", "「신문 등의 진흥에 관한 법률」 – 신문활용교육(NIE) – 여성가족부", "「디지털 기반의 원격교육 활성화 기본법」 – 디지털 미디어 문해교육 – 교육부", "「방송법」 제90조의2 – 시청자의 방송참여와 권익증진을 위한 미디어교육 – 방송통신위원회"], "a": 1, "e": "「신문법」(언론진흥기금의 용도 등)에 근거한 신문활용교육(NIE)의 소관 부처는 '문화체육관광부'이다. 여성가족부는 「청소년보호법」에 근거해 인터넷게임 중독·과몰입 등 매체물 오용·남용 예방 교육을 지원한다.", "w": ["맞는 연결. 지능정보화 기본법, 과학기술정보통신부 소관이다.", "틀린 연결(정답). 신문법의 NIE는 '문화체육관광부' 소관이다. 여성가족부는 청소년보호법을 근거로 한다.", "맞는 연결. 디지털 기반의 원격교육 활성화 기본법, 교육부 소관이다.", "맞는 연결. 방송법 제90조의2, 방송통신위원회 소관이다."]}, {"p": "109", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "버킹엄(Buckingham, 2003)의 미디어교육 정의에 대한 설명으로 옳은 것은?", "o": ["미디어교육은 TV·컴퓨터를 활용해 다른 교과를 가르치는 '미디어를 활용한 교육'이다.", "미디어교육은 수학·과학 등 다른 학문을 가르치는 보조수단이다.", "미디어교육은 '미디어에 대해(about the media)' 가르치고 배우는 과정이며, 이때 습득하는 지식과 기술이 미디어 리터러시이다.", "미디어교육은 미디어 역기능에 대한 '예방 접종'에만 초점을 둔다."], "a": 2, "e": "버킹엄은 미디어교육을 '미디어에 대해 가르치고 배우는 과정'으로 보고, 학습자가 습득하는 지식과 기술을 미디어 리터러시라 했다. 또한 '미디어를 통한 교육(through)'·'미디어를 활용한 교육(with)'과 구별되는 독립 분야로 보았다.", "w": ["틀린 설명. 이는 '미디어를 활용한 교육'으로, 버킹엄은 미디어교육을 이와 구별되는 독립 분야로 보았다.", "틀린 설명. 유네스코(1973)도 미디어교육을 다른 학문의 보조수단과 구분되는 독립 영역으로 보았다.", "옳은 설명(정답). 미디어에 '대해' 가르치고 배우는 과정이며, 그 결과 얻는 지식·기술이 미디어 리터러시이다.", "틀린 설명. 예방 접종 비유는 보호주의 관점이며 버킹엄의 정의는 이에 한정되지 않는다."]}, {"p": "110", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "학자와 미디어교육 관련 핵심 주장의 연결로 옳지 않은 것은?", "o": ["홉스(Hobbs, 2010) – 디지털 및 미디어 문해력: 접근·분석·창작·성찰·사회적 행동", "리빙스턴(Livingstone) – 미디어교육은 미디어를 활용해 학업 효과성을 높이는 보조 교육", "젠킨스(Jenkins, 2006) – 참여문화(participatory culture)", "포터(Potter, 2016) – 자신과 미디어 간 주도권 싸움에서 승리하는 방법을 가르치는 교육"], "a": 1, "e": "리빙스턴은 미디어 리터러시를 장르·유형·플랫폼별 특성 중심으로 정의할 수 있다고 보았고(2014), 미디어 리터러시가 창의성·연결성·커뮤니티 참여 능력 발달에 중요하다고 강조했다(2023). 미디어교육을 학업 보조 수단으로 본 것이 아니다.", "w": ["맞는 연결. 홉스는 접근·분석·창작·성찰·사회적 행동을 포함하는 평생학습 과정으로 정의했다.", "틀린 연결(정답). 리빙스턴은 미디어 리터러시를 장르·유형·플랫폼별 특성으로 정의하고 창의성·연결성·참여를 강조했다.", "맞는 연결. 젠킨스는 '참여문화'를 강조했다.", "맞는 연결. 포터는 자신과 미디어 간의 주도권 싸움에서 이기는 법을 가르치는 교육으로 보았다."]}, {"p": "113", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "1982년 독일에서 19개국 대표가 채택한 유네스코의 '그룬발트 미디어교육 선언'의 내용으로 옳지 않은 것은?", "o": ["미디어교육은 부모, 교사, 미디어 관계자, 정책 결정권자 모두가 역할을 할 때 가장 효과적이다.", "미디어교육은 학교가 단독으로 책임져야 하며 가정의 역할은 최소화해야 한다.", "아동의 미디어 이용 시간이 학교에서 보내는 시간보다 많다.", "미디어의 영향력을 일방적으로 비판하기보다 기정사실로 인정하고 중요한 문화적 요소로 인식해야 한다."], "a": 1, "e": "선언은 '학교와 가정'이 이미지·단어·소리가 넘쳐나는 세계에서 젊은이들을 준비시키는 데 책임을 '함께' 진다고 밝힌다.", "w": ["맞는 내용. 부모·교사·미디어 관계자·정책 결정권자 모두가 역할을 할 때 가장 효과적이라고 했다.", "틀린 내용(정답). 학교와 가정이 '함께' 책임을 진다고 했다.", "맞는 내용. 선언은 아동의 미디어 이용 시간이 학교 시간보다 많다고 지적한다.", "맞는 내용. 미디어의 영향력을 기정사실로 받아들이고 문화적 요소로 인식해야 한다고 했다."]}, {"p": "114-116", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "포터(Potter)의 미디어 리터러시 8단계론과 부모중재에 대한 설명으로 옳은 것은?", "o": ["'집중적 발달' 단계는 미디어 리터러시 발달의 최종 목표 단계이다.", "브론펜브레너의 생태체계이론에서 미디어는 미시체계에 속한다.", "제한적 중재는 자녀의 미디어 과의존과 온라인 위험 행동을 줄이는 데 적극적 중재보다 효과적이다.", "학령 초기(5~9세)인 '의심의 발달' 단계에서는 광고에 나오는 말을 신뢰하지 않게 된다."], "a": 3, "e": "의심의 발달 단계(5~9세)에서는 광고를 신뢰하지 않는다. 집중적 발달은 많은 사람이 머무는 '발달 정체' 단계이며, 미디어교육은 경험적 탐구→비판적 평가→사회적 책임 단계로 나아가게 한다. 선행연구는 적극적 중재가 더 효과적임을 보여주며, 미디어는 외체계(및 거시체계)와 관련된다.", "w": ["틀린 설명. 집중적 발달은 많은 사람이 머무는 '발달 정체' 단계이다.", "틀린 설명. 생태체계이론에서 미디어는 '외체계'에 속하며 거시체계와도 관련된다.", "틀린 설명. 선행연구는 '적극적 중재'가 과의존·위험 행동을 줄이는 데 더 효과적이라고 본다.", "옳은 설명(정답). 학령 초기(5~9세) 의심의 발달 단계에서는 광고를 신뢰하지 않게 된다."]}, {"p": "127", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "김양은(2009)의 언어 변화에 따른 커뮤니케이션 문화 특징 중 '디지털 언어(네트워크 미디어)'의 특징으로 옳지 않은 것은?", "o": ["새로운 현실(가상현실)을 창조한다.", "지식의 개인화를 가져왔다.", "비종속적이다(중심-주변의 상실).", "과거와 현재를 분리시킨다(역사성)."], "a": 3, "e": "'과거와 현재를 분리시킨다(역사성)'는 문자 언어(인쇄 미디어)의 특징이다. 디지털 언어는 과거·현재·미래를 통합(개인의 역사성)하며, 복합 감각적이고 즉시적(구술성에의 복귀)이다. 영상 언어는 물리적 시공간을 분리(비역사성)하고 지식의 대중화를 가져왔다.", "w": ["해당하지 않음. 디지털 언어의 특징이다.", "해당하지 않음. 디지털 언어의 특징이다(영상 언어는 지식의 대중화).", "해당하지 않음. 디지털 언어의 특징이다.", "해당함(정답). '과거와 현재 분리(역사성)'는 문자 언어(인쇄 미디어)의 특징이다."]}, {"p": "129-130", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "미디어 수용자 개념에 대한 설명으로 옳지 않은 것은?", "o": ["능동적 수용자의 지위는 개인적 해석, 집단적 해석, 집단적 정치적 행위의 결과이다.", "미디어 수용자 영역의 핵심은 수용자가 메시지를 제작자의 의도대로 정확히 해독하도록 훈련하는 것이다.", "홀(Hall, 1973)은 같은 메시지도 수용자의 사회·문화·경제적 배경에 따라 다르게 해석될 수 있다는 능동적 수용자론을 제시했다.", "디지털 환경에서 수용자는 센디언스(sender+audience)나 프로슈머로서의 역할이 가능해졌다."], "a": 1, "e": "수용자는 메시지를 사회적 맥락 속에서 다양하게 재구성·해석한다. 미디어교육에서는 수용자의 서로 다른 관점과 견해를 논의하고, 자신과 타인의 미디어 이용 방식을 이해·성찰하는 것이 중요하다(Buckingham, 2003).", "w": ["맞는 설명. Croteau 등(2012)이 제시한 능동적 수용자의 세 가지 근거이다.", "틀린 설명(정답). 수용자는 배경에 따라 다양하게 해석하며, 교육은 그 차이를 논의하고 성찰하게 하는 데 있다.", "맞는 설명. 홀의 능동적 수용자론이다.", "맞는 설명. 디지털 환경에서 수용자는 센디언스·프로슈머로 확장되었다."]}, {"p": "131-134", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "미디어교육 패러다임과 등장 시기·핵심 내용의 연결로 옳은 것은?", "o": ["보호주의 패러다임 – 1960년대 – 대중문화의 예술적 가치 인정", "재현 패러다임 – 1970년대 후반 – 미디어는 현실을 반영하지 않고 재구성하며, 기호학·이데올로기 이론의 영향을 받음", "디지털 환경 패러다임 – 1970년대 – 리비스와 톰슨의 『문화와 환경』", "대중예술 패러다임 – 1930년대 – 탄환이론에 근거한 '예방 접종'"], "a": 1, "e": "보호주의(1930년대): 리비스와 톰슨의 『문화와 환경』(1933), 탄환이론, 예방 접종 비유. 대중예술(1960년대): 대중문화의 예술적 가치 인정, 좋은 것/나쁜 것 판별. 재현(1970년대 후반): 기호학과 이데올로기 이론(홀, 알튀세르). 디지털 환경(2000년대): 창의적 제작과 주체적 사회 참여.", "w": ["틀린 연결. 보호주의는 1930년대이며 대중문화의 해로운 영향으로부터 보호하는 관점이다.", "옳은 연결(정답). 재현 패러다임은 1970년대 후반, 기호학·이데올로기 이론의 영향을 받았다.", "틀린 연결. 디지털 환경은 2000년대이고 『문화와 환경』(1933)은 보호주의 문헌이다.", "틀린 연결. 대중예술은 1960년대이며 '예방 접종'은 보호주의의 비유이다."]}, {"p": "135", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "홉스(Hobbs, 2010)의 AACRA 모델에 대한 설명으로 옳지 않은 것은?", "o": ["'성찰'은 사회적 책임과 윤리 원칙을 고려하고 타인에게 미칠 영향을 평가하는 단계이다.", "'행동'은 미디어와 기술 도구를 숙련되게 찾고 사용하는 단계이다.", "접근(Access), 분석·평가(Analyze & Evaluate), 창작(Create), 성찰(Reflect), 행동(Act)의 다섯 요소로 구성된다.", "선형적 구조가 아니라 순환적 구조를 특징으로 한다."], "a": 1, "e": "미디어와 기술 도구를 숙련되게 찾고 사용하며 정보를 공유하는 것은 '접근(Access)'이다. '행동(Act)'은 자기 작품의 영향력과 가치를 찾아보고 개인적·협력적으로 지식을 공유하고 문제 해결에 참여하는 단계이다.", "w": ["맞는 설명. 성찰은 사회적 책임과 윤리 원칙을 고려하는 단계이다.", "틀린 설명(정답). 도구를 찾고 사용하는 것은 '접근'이다. '행동'은 지식을 공유하고 문제 해결에 참여하는 단계이다.", "맞는 설명. AACRA의 다섯 요소이다.", "맞는 설명. 선형이 아니라 순환적 구조이다."]}, {"p": "141", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "스팬서와 스팬서(Spencer & Spencer, 1993)의 빙산 모델에서 '빙산의 보이는 면', 즉 상대적으로 관찰 가능한 가시적 역량에 해당하는 것은?", "o": ["동기, 특질", "지식, 기술", "특질, 자아개념", "자아개념, 동기"], "a": 1, "e": "빙산 모델은 역량을 동기·특질·자아개념·지식·기술 5가지로 구분한다. 지식과 기술은 수면 위의 가시적 역량, 자아개념·특질·동기는 수면 아래의 잠재적 역량이다.", "w": ["오답. 동기와 특질은 수면 아래의 잠재적 역량이다.", "정답. 지식과 기술이 수면 위의 관찰 가능한 가시적 역량이다.", "오답. 특질과 자아개념은 잠재적 역량이다.", "오답. 자아개념과 동기는 잠재적 역량이다."]}, {"p": "142-143", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "OECD의 역량 논의에 대한 설명으로 옳은 것은?", "o": ["DeSeCo 프로젝트의 3대 핵심역량은 '도구의 상호작용적 활용', '이질적인 집단과의 상호작용', '자율적 행동하기'이다.", "Education 2030은 교사 주도성(teacher agency)을 가장 핵심 개념으로 강조한다.", "Education 2030 프로젝트는 DeSeCo 이전에 진행된 선행 프로젝트이다.", "Education 2030의 변혁적 역량은 '자기관리', '지식정보처리', '창의적 사고'이다."], "a": 0, "e": "DeSeCo(1997~2003)의 3대 핵심역량은 도구의 상호작용적 활용, 이질적 집단과의 상호작용, 자율적 행동하기이다. 후속인 Education 2030(2015~)은 '학생 행위 주체성(student agency)'과 변혁적 역량(새로운 가치 창출, 긴장과 딜레마 조정하기, 책임감 갖기)을 제시했다. '자기관리·지식정보처리·창의적 사고'는 2022 개정 교육과정 핵심역량의 일부이다.", "w": ["옳은 설명(정답). DeSeCo 3대 핵심역량이다.", "틀린 설명. Education 2030은 '학생 행위 주체성(student agency)'을 강조한다.", "틀린 설명. Education 2030(2015~)은 DeSeCo(1997~2003)의 '후속' 프로젝트이다.", "틀린 설명. 이것은 2022 개정 교육과정 핵심역량이다. 변혁적 역량은 새로운 가치 창출·긴장과 딜레마 조정·책임감 갖기이다."]}, {"p": "143", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "2022 개정 교육과정 총론의 6대 핵심역량에 해당하지 않는 것은?", "o": ["협력적 소통", "공동체 역량", "심미적 감성", "디지털 시민성"], "a": 3, "e": "2022 개정 교육과정 핵심역량은 자기관리, 지식정보처리, 창의적 사고, 심미적 감성, 협력적 소통, 공동체 역량의 6가지이다. (2015 개정의 '의사소통'이 '협력적 소통'으로 바뀐 점도 기억)", "w": ["해당함. 2022 개정 교육과정 핵심역량이다.", "해당함. 2022 개정 교육과정 핵심역량이다.", "해당함. 2022 개정 교육과정 핵심역량이다.", "해당하지 않음(정답). 6대 핵심역량은 자기관리·지식정보처리·창의적 사고·심미적 감성·협력적 소통·공동체 역량이다."]}, {"p": "145", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "미디어 역량의 핵심요소 중 '미디어 활용 시 윤리의식을 바탕으로 상호존중·배려하며, 자신의 권리를 보호하고 책임의식을 함양할 수 있는 역량'은?", "o": ["권리·책임", "표현·소통", "이해·분석", "접근·이용"], "a": 0, "e": "미디어 역량의 4대 핵심요소는 접근·이용, 이해·분석, 표현·소통, 권리·책임이다(김슬기·박윤미·김지혜, 2023). 설명은 '권리·책임'에 해당한다.", "w": ["정답. 윤리의식, 권리 보호, 책임의식은 '권리·책임' 역량이다.", "오답. 표현·소통은 창의적으로 표현하고 협력·공유하는 역량이다.", "오답. 이해·분석은 메시지를 비판적으로 분석·평가·성찰하는 역량이다.", "오답. 접근·이용은 미디어에 접근하고 기본 기능을 이용하는 역량이다."]}, {"p": "145-151", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "미디어교육 10대 핵심 주제와 교육 목표의 연결로 옳지 않은 것은?", "o": ["디지털 활용 – 데이터·정보·디지털 콘텐츠의 검색-선별-구성-분석-처리-생성-활용 전 과정 이해", "정보판별과 확증편향 – 허위정보의 유형과 알고리즘 추천으로 인한 확증편향 문제 인식 및 정보 비교·분석·평가", "미디어 창작 – 기획-제작-공유·유통-성찰 등 제작의 전 과정을 학습하고 직접 제작에 참여", "디지털 안전 – 사이버폭력 및 혐오표현을 이해하고 디지털 공간에서 공유·협업하는 방법 학습"], "a": 3, "e": "사이버폭력·혐오표현 대응과 공유·협업은 '협력적 소통과 책임있는 이용'의 교육 목표이다. '디지털 안전'은 개인정보·프라이버시·지적재산권 보호 및 침해 시 대응, 디지털 범죄의 유형과 대응 방법을 다룬다.", "w": ["맞는 연결. 디지털 활용의 교육 목표이다.", "맞는 연결. 정보판별과 확증편향의 교육 목표이다.", "맞는 연결. 미디어 창작의 교육 목표이다.", "틀린 연결(정답). 사이버폭력·혐오표현과 공유·협업은 '협력적 소통과 책임있는 이용'의 내용이다."]}, {"p": "160-161", "s": "제2부 2장 범주1 디지털 시민과 신기술 미디어", "q": "유네스코(UNESCO, 2017)의 디지털 시민성 정의에 포함되지 않는 역량은?", "o": ["프로그래밍 언어로 소프트웨어를 직접 개발할 수 있는 역량", "비판적이고 민감하며 윤리적인 방식으로 타인 및 콘텐츠에 참여하는 역량", "온라인 및 ICT 환경을 안전하고 책임감 있게 탐색하는 역량", "효과적으로 정보를 찾고, 접근하고, 사용하고, 생성할 수 있는 역량"], "a": 0, "e": "유네스코는 디지털 시민성을 (1)  정보 탐색·접근·사용·생성 역량 (2)  비판적·윤리적 참여 역량 (3)  온라인·ICT 환경의 안전하고 책임감 있는 탐색 역량 (4)  자신의 권리를 인식하는 역량으로 정의했다.", "w": ["포함되지 않음(정답). 네 번째는 '자신의 권리를 인식하는 역량'이며 프로그래밍 능력은 정의에 없다.", "포함됨. 비판적·윤리적 참여 역량이다.", "포함됨. 온라인·ICT 환경의 안전하고 책임감 있는 탐색 역량이다.", "포함됨. 유네스코 정의의 첫 번째 역량이다."]}, {"p": "162", "s": "제2부 2장 범주1 디지털 시민과 신기술 미디어", "q": "디지털 시민성을 시민권의 세 가지 전통으로 이해할 때, '지역사회 참여를 적극 권장하며 경우에 따라 의무로 두고, 디지털 정보를 활용한 시민 참여 촉진'을 중시하는 전통은?", "o": ["공화주의 전통", "자유주의 전통", "귀속적 위계에 의한 불평등을 비판하는 전통", "보호주의 전통"], "a": 0, "e": "자유주의 전통은 개인의 권리·자유시장과 경제적 기회, 공화주의 전통은 지역사회 참여와 시민 참여 촉진, 세 번째 전통은 인종·성별 등 귀속적 지위의 불평등이 디지털 격차로 이어지는 것을 비판한다(박정의, 2024).", "w": ["정답. 공화주의 전통은 지역사회 참여를 권장하고 시민 참여 촉진을 중시한다.", "오답. 자유주의 전통은 개인의 권리, 자유시장, 경제적 기회에 초점을 둔다.", "오답. 이 전통은 귀속적 지위의 불평등이 디지털 격차로 이어지는 것을 비판한다.", "오답. 보호주의는 미디어교육 패러다임이지 시민권 전통이 아니다."]}, {"p": "163-164", "s": "제2부 2장 범주1 디지털 시민과 신기술 미디어", "q": "빅데이터에 대한 설명으로 옳지 않은 것은?", "o": ["인구 센서스나 공공 통계 수치는 정형 데이터의 대표적 예이다.", "소셜 미디어나 메신저에서 생산되는 텍스트·이미지·영상은 비정형 데이터에 해당한다.", "빅데이터 기반 분석은 일괄처리 방식, 전통적 분석은 분산처리 방식을 사용한다.", "빅데이터의 대표 속성 3Vs는 규모(Volume), 다양성(Variety), 속도(Velocity)이다."], "a": 2, "e": "전통적 분석은 '일괄처리 방식', 빅데이터 기반 분석은 '분산처리 방식'(Hadoop, NoSQL 등)을 사용한다. 3Vs 외에 진실성·가변성·시각화·가치를 추가하기도 한다.", "w": ["맞는 설명. 인구 센서스·통계는 정형 데이터이다.", "맞는 설명. 사용자 상호 교류에서 나온 데이터는 비정형이다.", "틀린 설명(정답). 거꾸로이다. 전통적 분석이 일괄처리, 빅데이터 분석이 분산처리이다.", "맞는 설명. 3Vs이다(추가로 진실성·가변성·시각화·가치)."]}, {"p": "165-167", "s": "제2부 2장 범주1 디지털 시민과 신기술 미디어", "q": "인공지능에 대한 설명으로 옳은 것은?", "o": ["현재 대부분의 인공지능은 강한 인공지능 수준에 도달해 있다.", "데이터 마이닝 기법 중 '군집분석'은 대상을 사전에 정의된 유형 중 하나에 할당하는 기술이다.", "딥러닝은 인공지능의 상위 개념이며, 머신러닝은 딥러닝의 하위 집합이다.", "'인공지능'이라는 용어는 1955년 존 매카시가 다트머스 워크숍에서 처음 사용하였다."], "a": 3, "e": "존 매카시가 1955년 다트머스 워크숍에서 처음 사용했다. 포함관계는 인공지능 ⊃ 머신러닝 ⊃ 딥러닝이며, 현재 대부분은 '약한 인공지능' 수준이다. 사전 정의된 유형에 할당하는 것은 '분류', 군집분석은 데이터를 의미 있는 그룹으로 나누는 기법이다.", "w": ["틀린 설명. 현재 대부분은 특정 문제만 푸는 '약한 인공지능' 수준이다.", "틀린 설명. 사전 정의된 유형에 할당하는 것은 '분류', 군집분석은 데이터를 유사한 그룹으로 나누는 것이다.", "틀린 설명. 인공지능 ⊃ 머신러닝 ⊃ 딥러닝 순으로 포함한다.", "옳은 설명(정답). 존 매카시가 1955년 다트머스 워크숍에서 처음 사용했다."]}, {"p": "168-169", "s": "제2부 2장 범주1 디지털 시민과 신기술 미디어", "q": "사용자 A와 취향이 비슷한 사용자 B가 높게 평가한 영화를 사용자 A에게 추천하는 추천 알고리즘 방식과, AI가 현실에 없는 내용을 생성해 내는 현상을 순서대로 바르게 짝지은 것은?", "o": ["콘텐츠 기반 필터링 – 증강지능(augmented intelligence)", "협업 필터링 – 멀티 모달(multi-modality)", "콘텐츠 기반 필터링 – 환각현상(hallucination)", "협업 필터링 – 환각현상(hallucination)"], "a": 3, "e": "유사한 선호를 보인 다른 사용자의 평가를 바탕으로 추천하는 것은 '협업 필터링'이다. 콘텐츠 기반 필터링은 사용자 본인의 이전 활동·선호도에 기반한다. AI가 잘못된 결론으로 현실에 없는 콘텐츠를 생성하는 것은 '환각현상'이다.", "w": ["오답. 증강지능은 사람의 판단력과 컴퓨터의 데이터 처리 능력을 결합한 인공지능이다.", "오답. 멀티 모달은 텍스트·음성·이미지 등 여러 채널을 함께 쓰는 방식이다.", "오답. 콘텐츠 기반 필터링은 사용자 '본인'의 이전 활동·선호를 기반으로 추천한다.", "정답. 비슷한 취향의 다른 사용자 평가로 추천하는 것은 협업 필터링, 없는 내용을 만드는 것은 환각현상이다."]}, {"p": "171-173", "s": "제2부 2장 범주1 디지털 시민과 신기술 미디어", "q": "미국 가속연구재단(ASF)의 메타버스 4가지 유형에서 '구글 어스'와 같이 물리적 세계를 사실에 가깝게 재현하고 정보를 더해 확장한 유형(시뮬레이션/외적인)은?", "o": ["라이프로깅", "증강현실", "거울 세계", "가상현실"], "a": 2, "e": "증강현실(증강/외적: 포켓몬 고, HUD), 라이프로깅(증강/사적: 소셜 미디어, 건강 앱), 거울 세계(시뮬레이션/외적: 구글 어스), 가상현실(시뮬레이션/사적). 참고로 메타버스 윤리원칙의 3대 지향가치는 온전한 자아·안전한 경험·지속가능한 번영이다.", "w": ["오답. 라이프로깅(증강/사적)은 소셜 미디어처럼 일상을 기록·공유한다.", "오답. 증강현실(증강/외적)은 포켓몬 고, HUD처럼 현실에 가상 이미지를 겹친다.", "정답. 거울 세계(시뮬레이션/외적)는 구글 어스처럼 현실을 재현하고 정보를 더한다.", "오답. 가상현실(시뮬레이션/사적)은 현실과 유사하거나 대안적인 세계를 구축한다."]}, {"p": "180-181", "s": "제2부 2장 범주2 미디어의 활용과 창작", "q": "데이터의 속성 분류에 대한 설명으로 옳은 것은?", "o": ["관계형 데이터베이스(RDB)의 테이블, 스프레드시트, CSV 파일은 반정형 데이터이다.", "JSON, XML 파일, 로그 파일은 정형 데이터의 대표적 예이다.", "비정형 데이터는 그 자체만으로는 질의 처리(query processing)를 할 수 없어 전처리가 필요하다.", "지식은 특정한 형식이나 의미가 없는 단순한 값의 집합이다."], "a": 2, "e": "비정형 데이터는 정의된 구조가 없어 특징을 추출해 반정형·정형 데이터로 변환하는 전처리가 필요하다. RDB 테이블·스프레드시트·CSV는 정형, JSON·XML·로그 파일은 반정형 데이터이다. 의미 없는 단순한 값의 집합은 '데이터'이며, 지식은 정보가 추상화되고 패턴이 도출된 '합성된 정보'이다.", "w": ["틀린 설명. RDB 테이블·스프레드시트·CSV는 정형 데이터이다.", "틀린 설명. JSON·XML·로그 파일은 반정형 데이터이다.", "옳은 설명(정답). 비정형 데이터는 구조가 없어 전처리가 필요하다.", "틀린 설명. 의미 없는 단순한 값의 집합은 '데이터'이고, 지식은 정보가 추상화된 합성된 정보이다."]}, {"p": "181", "s": "제2부 2장 범주2 미디어의 활용과 창작", "q": "맥크리디와 라이스(McCreadie & Rice, 1999)가 제시한 정보의 4가지 관점 중 '정보의 의미는 단어나 데이터 자체가 아니라 이를 해석하는 사람에게 있다'는 관점은?", "o": ["환경 속에서 얻어지는 데이터", "자원 또는 상품", "커뮤니케이션 과정의 일부", "지식의 표현"], "a": 2, "e": "'커뮤니케이션 과정의 일부'라는 관점은 정보의 의미가 해석하는 사람에게 있으며, 정보의 처리와 해석에서 시점과 사회적 요인이 중요하다고 본다.", "w": ["오답. 의도 없는 환경 자극도 해석하면 정보가 된다는 관점이다.", "오답. 정보가 메시지로 전달·교환되며 부가가치가 더해진다는 관점이다.", "정답. 정보의 의미가 해석하는 사람에게 있다는 관점이다.", "오답. 지식의 표현은 정보를 저장된 지식으로 보는 관점이다."]}, {"p": "184", "s": "제2부 2장 범주2 미디어의 활용과 창작", "q": "데이터 압축에 대한 설명으로 옳지 않은 것은?", "o": ["ZIP 파일과 PNG 이미지는 무손실 압축의 예이다.", "데이터 압축의 주된 목적은 비인가자가 데이터를 읽을 수 없도록 하는 것이다.", "무손실 압축은 압축 후 원래 데이터로 완벽하게 복원할 수 있다.", "JPG 이미지, MP3 오디오, MPEG 비디오는 손실 압축 방식을 주로 사용한다."], "a": 1, "e": "비인가자가 읽을 수 없도록 인코딩하는 것은 '데이터 암호화'의 목적이다. 데이터 압축은 효율적인 저장·전송을 위해 크기를 줄여 저장 공간 절약과 전송 시간 단축을 목적으로 한다.", "w": ["맞는 설명. ZIP과 PNG는 무손실 압축이다.", "틀린 설명(정답). 비인가자가 못 읽게 하는 것은 '암호화'의 목적이다.", "맞는 설명. 무손실 압축은 완벽 복원이 가능하다.", "맞는 설명. JPG, MP3, MPEG는 손실 압축이다."]}, {"p": "185", "s": "제2부 2장 범주2 미디어의 활용과 창작", "q": "디지털 콘텐츠의 특징 중 '다른 사람에게 이전하더라도 원본 콘텐츠는 소유주가 보관하게 되어 재전송이 가능한' 특성은?", "o": ["항상성", "결합성", "가치상대성", "비이전성"], "a": 3, "e": "비이전성에 대한 설명이다. 항상성=시간이 지나도 같은 품질 유지, 결합성=콘텐츠 간 실시간 전송·결합 용이, 가치상대성=개인마다 가치 평가가 달라 가격 결정이 어려움. 이 외에 변형 가능성, 보관 편리성, 재생가능성이 있다.", "w": ["오답. 항상성은 시간이 지나도 같은 품질을 유지하는 특성이다.", "오답. 결합성은 콘텐츠 간 실시간 전송·결합이 쉬운 특성이다.", "오답. 가치상대성은 개인마다 가치 평가가 달라 가격 결정이 어려운 특성이다.", "정답. 이전해도 원본이 남아 재전송이 가능한 것이 비이전성이다."]}, {"p": "186", "s": "제2부 2장 범주2 미디어의 활용과 창작", "q": "현실 세계의 데이터를 다양한 디지털 기기로 입력받아 소프트웨어로 처리한 뒤 그 결과를 다양한 장치로 출력하는 것, 즉 현실세계와 컴퓨터가 데이터를 통해 소통하는 것을 무엇이라 하는가?", "o": ["피지컬 컴퓨팅", "클라우드 컴퓨팅", "데이터 마이닝", "시스템 소프트웨어"], "a": 0, "e": "피지컬 컴퓨팅은 직접 기기를 조립·조정하는 과정이 필요하며 사물인터넷 구축에 중요한 기술이다. 센서 구성과 활용방법에 따라 로봇형, 모듈형, 보드형 등으로 구분한다.", "w": ["정답. 현실세계와 컴퓨터가 데이터로 소통하는 것이 피지컬 컴퓨팅이다.", "오답. 클라우드 컴퓨팅은 교재에서 이렇게 정의하지 않는다.", "오답. 데이터 마이닝은 대량 데이터에서 패턴과 규칙을 찾는 분석 기법이다.", "오답. 시스템 소프트웨어는 운영체제처럼 하드웨어를 동작시키는 소프트웨어이다."]}, {"p": "190", "s": "제2부 2장 범주2 미디어의 활용과 창작", "q": "미디어 콘텐츠 기획(pre-production)의 세부 단계를 순서대로 바르게 나열한 것은?", "o": ["목적 설정 → 주시청자 분석 및 설정 → 아이디어 발의 및 아이템 선정 → 기획안 작성 → 구성안 작성", "아이디어 발의 → 목적 설정 → 구성안 작성 → 주시청자 분석 → 기획안 작성", "목적 설정 → 기획안 작성 → 구성안 작성 → 주시청자 분석 → 아이템 선정", "주시청자 분석 → 목적 설정 → 기획안 작성 → 아이디어 발의 → 구성안 작성"], "a": 0, "e": "기획은 「목적 설정 → 주시청자 분석 및 설정 → 아이디어 발의 및 아이템 선정 → 기획안 작성 → 구성안 작성」 순서이다. 구성안은 생방송·스튜디오는 큐시트, 드라마는 콘티뉴이티(스토리보드), 다큐멘터리는 촬영구성안 형태로 작성한다.", "w": ["정답. 목적 설정 → 주시청자 → 아이디어·아이템 → 기획안 → 구성안 순서이다.", "오답. 아이디어 발의는 목적과 주시청자가 정해진 뒤에 한다.", "오답. 주시청자 분석과 아이템 선정이 기획안 작성보다 앞선다.", "오답. 목적 설정이 먼저 와야 주시청자를 설정할 수 있다."]}, {"p": "191-192, 196", "s": "제2부 2장 범주2 미디어의 활용과 창작", "q": "미디어 콘텐츠 제작·편집 및 스토리텔링에 대한 설명으로 옳지 않은 것은?", "o": ["팬(pan), 틸트(tilt), 줌(zoom)은 고정샷에, 트랙킹·붐·달리는 무빙샷에 해당한다.", "화면 전환(transition) 기법에는 컷, 디졸브, 페이드, 와이프 등이 있다.", "비순차 편집은 디지털 방식으로 컷의 순서와 위치에 상관없이 자유롭게 삽입·삭제할 수 있다.", "트랜스미디어 스토리텔링은 OSMU처럼 미디어가 달라져도 동일한 내용을 반복하는 방식이다."], "a": 3, "e": "OSMU(One Source Multi Use)는 미디어가 달라져도 내용 변화 없이 동일한 내용이 반복된다. 반면 젠킨스의 트랜스미디어 스토리텔링은 세계관은 공유하되 각 매체 특성에 맞게 다른 이야기를 전개해 핵심 내용에 기여하는 방식이다.", "w": ["맞는 설명. 팬·틸트·줌은 고정샷, 트랙킹·붐·아킹·달리는 무빙샷이다.", "맞는 설명. 화면 전환 기법에는 컷·디졸브·페이드·와이프가 있다.", "맞는 설명. 비순차 편집은 디지털 방식으로 자유롭게 인서트할 수 있다.", "틀린 설명(정답). 트랜스미디어 스토리텔링은 세계관을 공유하되 매체마다 다른 이야기를 전개한다. 같은 내용 반복은 OSMU이다."]}]}, {"name": "2회차", "questions": [{"p": "9", "s": "제1부 1장 커뮤니케이션", "q": "커뮤니케이션의 정의에 대한 설명으로 옳지 않은 것은?", "o": ["커뮤니케이션은 한 번의 전달로 완결되는 정지된 행위이다.", "커뮤니케이션은 의미를 주고받는 반복적 과정(process)상에 존재한다.", "'Communication'은 '공통된' 또는 '공유하다'라는 뜻의 라틴어 communis에서 유래했다.", "communis에서 파생된 단어로 community(공동체)가 있다."], "a": 0, "e": "커뮤니케이션은 순환되는 과정에서 이뤄지므로 정지된 행위가 아니라, 부호화와 해독을 통해 의미를 주고받는 반복적 과정이다.", "w": ["틀린 설명(정답). 교재는 커뮤니케이션을 '정지된 행위가 아닌' 반복적 과정으로 설명한다.", "맞는 설명. 송신자의 부호화와 수신자의 해독이 반복되는 과정이다.", "맞는 설명. 어원은 라틴어 communis(공통된, 공유하다)이다.", "맞는 설명. communis에서 community(공동체)가 파생되었다."]}, {"p": "15-16", "s": "제1부 1장 커뮤니케이션", "q": "화자의 경험·관점·감정에 중점을 두고 '나'를 표현하는 언어 사용이 핵심인 화법은?", "o": ["도구적 화법", "상황중심화법", "간결화법", "개인중심화법"], "a": 3, "e": "개인중심화법은 화자의 경험·관점·감정을 중심으로 '나'를 표현하고, 상황중심화법은 상황과 맥락을 고려해 나의 사회적 '역할'을 표현한다.", "w": ["오답. 도구적 화법은 명확하고 논리적으로 목적 달성을 강조하는 화법이다.", "오답. 상황중심화법은 특정 상황·맥락에서 자신의 사회적 '역할'을 표현하는 화법이다.", "오답. 간결화법은 간단하고 명확한 언어로 메시지를 전달하는 화법이다.", "정답. '나'의 경험·관점·감정을 표현하는 것이 개인중심화법이다."]}, {"p": "22", "s": "제1부 1장 커뮤니케이션", "q": "조직 커뮤니케이션 유형 중 '외향성·공식성'(조직 외부 수용자 대상의 공식적 커뮤니케이션)에 해당하는 것은?", "o": ["루머, 가십", "정책 및 절차 고지", "PR, 광고, 판촉 활동", "연줄 또는 네트워크 활용"], "a": 2, "e": "조직 커뮤니케이션은 대상(내향/외향)과 형태(공식/비공식)로 나뉜다. 외향·공식은 PR·광고·판촉, 조직 간 계약, 충원, 연구개발이다.", "w": ["오답. 루머와 가십은 '내향·비공식' 커뮤니케이션이다.", "오답. 정책·절차 고지는 조직 내부를 대상으로 한 '내향·공식' 커뮤니케이션이다.", "정답. PR·광고·판촉은 외부 수용자를 대상으로 한 공식 커뮤니케이션이다.", "오답. 연줄·네트워크 활용은 '외향·비공식' 커뮤니케이션이다."]}, {"p": "23", "s": "제1부 1장 커뮤니케이션", "q": "공통의 관심사를 공유하며 상호유기적 관계를 맺고 특정 사안에 대해 독자적 의견을 가진 사람들의 집단을 가리키는 말은?", "o": ["대중(Mass)", "군중(Crowd)", "1차 집단(Primary group)", "공중(Public)"], "a": 3, "e": "공중(Public)은 공공 규범이나 조직성이 없이 일시적으로 모인 군중, 불특정 다수인 대중과 구별된다.", "w": ["오답. 대중은 불특정 다수로 이뤄진 집단이다.", "오답. 군중은 공공 규범이나 조직성 없이 일시적으로 모인 사람들이다.", "오답. 1차 집단은 가족·친구처럼 기본 필요를 충족하는 소집단이다.", "정답. 공통 관심사와 독자적 의견을 가진 유기적 집단이 공중이다."]}, {"p": "26", "s": "제1부 1장 커뮤니케이션", "q": "그리핀(Griffin)이 정리한 커뮤니케이션 연구 전통 중 '커뮤니케이션의 전자적·기계적 측면에 중점을 두고 정보처리 기능, 피드백, 통제 등을 연구'하는 전통은?", "o": ["수사학적 연구", "비판적 연구", "사이버네틱스 연구", "현상학적 연구"], "a": 2, "e": "7가지 연구 전통은 사회심리학적, 사이버네틱스, 수사학적, 기호학적, 사회문화적, 비판적, 현상학적 연구이며 서로 보완적이다.", "w": ["오답. 수사학적 연구는 설득과 비판적 사고, 효과적인 연설 방법을 연구한다.", "오답. 비판적 연구는 권력 불균형과 언어 통제, 미디어의 억압적 역할을 분석한다.", "정답. 정보처리·피드백·통제를 다루는 것이 사이버네틱스 연구이다.", "오답. 현상학적 연구는 대화를 통한 자아와 타자의 경험을 탐구한다."]}, {"p": "31", "s": "제1부 2장 미디어의 기능과 효과", "q": "미디어의 개념에 대한 설명으로 옳지 않은 것은?", "o": ["맥루안은 미디어를 개별적으로 존재하는 중립적 전달 도구로만 보아야 한다고 주장했다.", "미디어는 medium의 복수형으로 라틴어 medius('중간에 있는 것')에서 유래했다.", "맥루안은 미디어를 사람들의 인식 구조와 상호작용하는 '환경'으로 정의했다.", "한국어로는 '매체(媒體)'로 번역되며 '중재하다', '매개하다'라는 의미가 있다."], "a": 0, "e": "맥루안은 미디어 생태학적 관점에서 미디어를 연결된 생태계의 한 부분이자 환경으로 보았다. 도구적 정의를 벗어난 관점이다.", "w": ["틀린 설명(정답). 맥루안은 도구로만 보는 시각을 벗어나, 미디어를 생태계의 일부로 인식해야 한다고 보았다.", "맞는 설명. medius는 '중간에 있는 것'을 뜻한다.", "맞는 설명. 맥루안은 환경으로서의 미디어를 정의했다.", "맞는 설명. 매체는 중재·매개의 의미를 가진다."]}, {"p": "32", "s": "제1부 2장 미디어의 기능과 효과", "q": "방송 미디어 연대기에 대한 설명으로 옳은 것은?", "o": ["1844년 벨이 전신을 발명하며 전자 미디어 시대가 시작되었다.", "1895년 에디슨이 시네마토그라프를 발명했다.", "우리나라 최초의 텔레비전 방송인 대한방송은 1941년에 개국했다.", "1927년 우리나라 최초의 라디오 방송국인 경성방송(JODK)이 개국했다."], "a": 3, "e": "1844년 모스의 전신, 1876년 벨의 전화, 1877년 에디슨의 축음기, 1895년 마르코니 무선통신과 뤼미에르 형제의 시네마토그라프, 1927년 경성방송, 1956년 대한방송 순이다.", "w": ["틀린 설명. 1844년 전신을 발명한 사람은 새뮤얼 '모스'이며, 벨은 1876년 전화 통화에 성공했다.", "틀린 설명. 시네마토그라프는 '뤼미에르 형제'가 발명했다. 에디슨은 축음기(1877)를 발명했다.", "틀린 설명. 1941년은 미국 최초 상업 TV 방송이며, 대한방송은 1956년에 개국했다.", "옳은 설명(정답). 1927년 경성방송(JODK)이 개국했다."]}, {"p": "39", "s": "제1부 2장 미디어의 기능과 효과", "q": "미디어 편향성이 발생하는 원인 중 '수요자 측면'의 원인에 해당하는 것은?", "o": ["미디어가 수용자 대중의 기존 믿음에 부합하는 뉴스를 중점 보도하는 경향", "기자의 신념과 정치적 태도", "정부의 규제와 압력", "언론사가 특정 기업의 광고수익에 크게 의존하는 것"], "a": 0, "e": "공급자 측면은 기자의 신념, 제작관행·조직문화, 언론사 간 경쟁, 광고주, 정부 규제와 압력이다. 수요자 측면은 수용자의 기존 믿음에 맞는 뉴스를 보도하는 경향이다.", "w": ["정답. 수용자의 기존 믿음에 맞추는 것은 '수요자' 측면의 원인이다.", "오답. 기자의 신념과 정치적 태도는 '공급자' 측면의 원인이다.", "오답. 정부의 규제와 압력은 '공급자' 측면의 원인이다.", "오답. 광고주 의존은 '공급자' 측면의 원인이다."]}, {"p": "41", "s": "제1부 2장 미디어의 기능과 효과", "q": "김용찬(2020)이 미디어 개념에 '도구'와 '내용' 외에 추가한 세 가지 차원으로 옳은 것은?", "o": ["제도, 사람, 공간", "정보, 오락, 교육", "환경, 생태, 진화", "산업, 기술, 시장"], "a": 0, "e": "김용찬은 미디어를 도구·내용·제도·사람·공간의 다섯 차원으로 개념화했다. 제도는 조직·규제·규범, 사람은 1인 미디어처럼 누군가를 연결하는 존재, 공간은 스마트 도시처럼 공간이 소통 통로가 되는 상황이다.", "w": ["정답. 제도로서의, 사람으로서의, 공간으로서의 미디어를 추가했다.", "오답. 정보·오락·교육은 미디어의 기능에 가깝고 다섯 차원 개념이 아니다.", "오답. 환경·생태·진화는 맥루안이나 피들러의 논의와 관련된 용어이다.", "오답. 산업·기술·시장은 김용찬의 다섯 차원에 없다."]}, {"p": "45", "s": "제1부 2장 미디어의 기능과 효과", "q": "의제설정효과에 관한 연구 내용으로 옳지 않은 것은?", "o": ["해당 뉴스에 대해 잘 모를수록 효과가 커진다.", "의제설정효과는 모든 사람에게 동일한 방식과 크기로 일어난다.", "뉴스가 개인에게 유용하거나 적절할수록 효과가 커진다.", "뉴스 정보가 불확실해 지향 욕구가 강할수록 효과가 커진다."], "a": 1, "e": "의제설정효과는 개인적·사회적 상황 요인에 따라 다르게 나타나며, 유용성·무지·정보추구욕구(지향 욕구)가 클수록 커진다.", "w": ["맞는 설명. 잘 모르는 뉴스일수록 효과가 커진다.", "틀린 설명(정답). 교재는 의제설정효과가 모든 사람에게 동일한 방식으로 일어나지 않는다고 설명한다.", "맞는 설명. 유용하거나 적절한 뉴스일수록 효과가 커진다.", "맞는 설명. 지향 욕구가 강할수록 효과가 커진다."]}, {"p": "49", "s": "제1부 2장 미디어의 기능과 효과", "q": "김원용·이동훈(2005)의 언론보도 프레임 유형 중 '사건의 책임소재를 추궁하거나 원인을 추론하는' 프레임은?", "o": ["가치 프레임", "배경 프레임", "귀인 프레임", "정황 프레임"], "a": 2, "e": "프레임은 행위-추상, 발화-결과 두 축으로 나뉜다. 정황(행위 결과·대립 상황), 귀인(책임소재·원인 추론), 배경(사회문화적 원인과 배경), 가치(해결을 위한 규범·도덕성) 프레임이다.", "w": ["오답. 가치 프레임은 문제 해결을 위한 사회문화적 규범과 도덕성을 강조한다.", "오답. 배경 프레임은 사건의 원인과 배경을 사회문화적 맥락에서 강조한다.", "정답. 책임소재 추궁과 원인 추론은 귀인 프레임이다.", "오답. 정황 프레임은 갈등보도처럼 행위로 인한 결과나 대립·대치 상황에 초점을 둔다."]}, {"p": "58", "s": "제1부 3장 미디어 산업", "q": "디지털 플랫폼의 수익 구조에 대한 설명으로 옳은 것은?", "o": ["트래픽 기반 제3자 광고 수익은 '직접 수익'에 해당한다.", "멤버십 등 플랫폼 사용권 판매 수익은 '간접 수익'에 해당한다.", "거래액 일부를 중개 수수료로 받는 것은 '직접 수익'에 해당한다.", "플랫폼 자산·인지도를 활용한 수익 사업 확장은 '직접 수익'에 해당한다."], "a": 2, "e": "직접 수익은 생태계 내부에서 얻는 사용료·멤버십과 중개 수수료이고, 간접 수익은 트래픽 기반 제3자 광고와 플랫폼 자산·인지도를 활용한 사업 확장이다.", "w": ["틀린 설명. 트래픽 기반 광고 수익은 '간접 수익'이다.", "틀린 설명. 사용권(사용료, 멤버십) 판매는 '직접 수익'이다.", "옳은 설명(정답). 중개 기능의 대가인 수수료는 직접 수익이다.", "틀린 설명. 자산·인지도를 활용한 사업 확장은 '간접 수익'이다."]}, {"p": "58", "s": "제1부 3장 미디어 산업", "q": "기술 및 비즈니스 중심성에 따른 디지털 플랫폼 분류와 사례의 연결로 옳지 않은 것은?", "o": ["기술형 플랫폼 – AWS, 구글 클라우드, MS Azure", "하이브리드 플랫폼 – 페이스북, 토스, 마켓컬리", "기술형 플랫폼 – 우버, 애플 앱스토어", "비즈니스형 플랫폼 – 배달의 민족, 쿠팡, 카카오T"], "a": 2, "e": "기술형은 개발자가 앱 개발·배포 등을 하는 기술 기반 플랫폼, 비즈니스형은 거래 촉진과 수익 창출이 목적, 하이브리드는 둘을 결합한 형태이다.", "w": ["맞는 연결. 클라우드 서비스는 기술형 플랫폼이다.", "맞는 연결. 페이스북·토스·마켓컬리는 하이브리드형이다.", "틀린 연결(정답). 우버와 애플 앱스토어는 교재에서 '비즈니스형' 플랫폼으로 분류된다.", "맞는 연결. 배달의 민족·쿠팡·카카오T는 비즈니스형이다."]}, {"p": "59", "s": "제1부 3장 미디어 산업", "q": "미디어 상품이 '공공재'와 '사유재'의 특성을 함께 지닌다는 설명으로 옳은 것은?", "o": ["미디어 재화는 여러 사람이 경합 없이 동시에 소비할 수 있는 공공재이지만 소비자에게 사유재 형태로 전달된다.", "미디어 상품은 사유재의 특성만 가진다.", "공공재는 한 사람의 소비가 다른 사람의 소비를 배제하는 경합성을 가진다.", "미디어 재화는 사유재이지만 공공재 형태로 전달된다."], "a": 0, "e": "공공재는 경합 없이 동시 소비가 가능하고, 사유재는 소비의 경합성을 가진다. 미디어 재화는 공공재이지만 사유재 형태로 전달되어 두 특성을 모두 지닌다.", "w": ["옳은 설명(정답). 교재의 설명 그대로이다.", "틀린 설명. 공공재와 사유재 특성을 동시에 지닌다.", "틀린 설명. 경합성은 '사유재'의 특성이다.", "틀린 설명. 순서가 반대이다. 공공재인 미디어 재화가 사유재 형태로 전달된다."]}, {"p": "60", "s": "제1부 3장 미디어 산업", "q": "하나의 기업이 두 가지 이상의 제품을 동시에 생산할 때의 비용이 별개의 두 기업이 각각 생산할 때 비용의 합보다 작은 현상은?", "o": ["범위의 경제", "창구효과", "네트워크 외부효과", "규모의 경제"], "a": 0, "e": "범위의 경제를 통해 미디어 기업은 제품과 서비스를 다양화하여 시장 점유율과 수익을 높일 수 있다.", "w": ["정답. 여러 제품을 함께 생산해 비용을 줄이는 것이 범위의 경제이다.", "오답. 창구효과는 하나의 콘텐츠를 시차를 두고 여러 미디어로 유통하는 것이다.", "오답. 네트워크 외부효과는 이용자가 많을수록 네트워크 가치가 커지는 것이다.", "오답. 규모의 경제는 생산 규모가 커질수록 평균비용이 하락하는 현상이다."]}, {"p": "56, 67", "s": "제1부 3장 미디어 산업", "q": "교재에 제시된 신문 산업 현황(2023 신문산업 실태조사)에 대한 설명으로 옳지 않은 것은?", "o": ["인터넷 신문 기자 수가 한국 신문 사상 처음으로 종이신문 기자 수를 넘어섰다.", "구독 수입 비율은 전년보다 하락했다.", "종이신문의 구독률과 열독률은 디지털 환경에서 꾸준히 상승하고 있다.", "2022년 신문산업 매출액 중 광고 수입 비율은 65.5%였다."], "a": 2, "e": "디지털 환경에서 종이신문의 구독률·열독률 하락이 지속되며 신문 산업 위기가 대두되고 있다. 광고 의존은 심화되었고 인터넷 신문 기자가 53.5%를 차지했다.", "w": ["맞는 설명. 인터넷 신문 기자 53.5%, 종이신문 기자 46.5%였다.", "맞는 설명. 구독 수입 비율은 16.8%에서 13.6%로 하락했다.", "틀린 설명(정답). 종이신문 구독률·열독률은 '하락'이 지속되고 있다.", "맞는 설명. 광고 수입 비율은 65.5%로 전년보다 4.9%p 상승했다."]}, {"p": "77", "s": "제1부 3장 미디어 산업", "q": "EU 시청각 미디어 서비스 지침(AVMSD)이 유럽에서 서비스하는 스트리밍 플랫폼에 부과한 의무는?", "o": ["매출의 50%를 유럽 콘텐츠 제작에 투자", "모든 콘텐츠에 유럽어 자막을 의무화", "미국 콘텐츠의 비율을 10% 이하로 제한", "유럽에서 제작된 영화·TV 프로그램을 최소 30% 편성 또는 제공"], "a": 3, "e": "미국발 글로벌 스트리밍 서비스의 강세에 대응해 유럽의 정체성과 자국 콘텐츠 산업을 보호하려는 조치이다.", "w": ["오답. 매출의 50% 투자 의무는 교재에 없는 내용이다.", "오답. 자막 의무는 지침의 내용으로 제시되지 않았다.", "오답. 미국 콘텐츠 비율을 직접 제한하는 내용은 교재에 없다.", "정답. 유럽 제작 콘텐츠를 최소 30% 편성·제공해야 한다."]}, {"p": "75", "s": "제1부 3장 미디어 산업", "q": "에듀테크(EduTech)에 대한 설명으로 가장 적절한 것은?", "o": ["기술을 학습 수단으로 쓰는 것을 넘어 데이터와 소프트웨어를 기반으로 학습자 분석, 의사소통, 정보관리를 쉽게 하여 학습성과를 높이는 데 초점을 둔다.", "교육 분야에서 인공지능 사용을 금지하는 정책을 말한다.", "교육 내용을 TV로 방송하는 원격 방송 교육만을 뜻한다.", "과거의 이러닝과 완전히 동일한 개념이다."], "a": 0, "e": "에듀테크는 교육(education)과 기술(tech)의 합성어로 스마트 수업·이러닝과 유사하지만, 데이터·소프트웨어 기반으로 학습성과 제고에 초점을 둔다는 점이 다르다.", "w": ["정답. 데이터·소프트웨어 기반 학습자 분석으로 학습성과를 높이는 데 초점을 둔다.", "오답. 오히려 생성형 AI 활용 수업에 대한 관심이 높아지고 있다고 설명한다.", "오답. 원격 방송 교육에 한정된 개념이 아니다.", "오답. 유사하지만 데이터 기반 학습 분석에 초점을 둔다는 점에서 다르다."]}, {"p": "86", "s": "제1부 4장 미디어 관련 법제", "q": "표현의 자유의 내용에 대한 설명으로 옳지 않은 것은?", "o": ["결사의 자유는 공동의 목적을 가진 다수인이 자발적으로 '계속적인' 단체를 조직할 자유이다.", "언론·출판의 자유는 다른 기본권보다 항상 우월적 지위를 갖는다.", "집회의 자유는 공동의 목적을 가진 다수인이 자발적으로 '일시적인' 모임을 가질 자유이다.", "학문 표현의 자유와 예술 표현의 자유는 헌법 제21조와 제22조가 함께 보호하므로 더 높은 수준으로 보호해야 한다."], "a": 1, "e": "표현의 자유가 중요하다고 해서 언론·출판의 자유가 항상 우월한 것은 아니며, 다른 기본권과 상충하면 기본권 상충의 일반이론으로 해결한다.", "w": ["맞는 설명. 결사는 계속적인 단체 조직이다.", "틀린 설명(정답). 교재는 언론·출판의 자유가 '항상' 우월적 지위를 갖는 것은 아니라고 설명한다.", "맞는 설명. 집회는 일시적인 모임이다.", "맞는 설명. 제21조와 제22조가 함께 보호한다."]}, {"p": "87-88", "s": "제1부 4장 미디어 관련 법제", "q": "알 권리에 대한 설명으로 옳은 것은?", "o": ["알 권리는 자유권의 성격만 가지고 청구권의 성격은 없다.", "알 권리는 보도 대상자가 가지는 대표적 권리이다.", "현대에는 국가가 수집한 정보를 공공재가 아닌 국가의 독점 재산으로 본다.", "우리나라는 1996년 「공공기관의 정보공개에 관한 법률」을 제정하여 정보공개청구를 제도적으로 보장하고 있다."], "a": 3, "e": "알 권리는 정보원에 접근해 정보를 수집할 자유(자유권)와 국가에 정보 공개를 청구할 권리(청구권)를 모두 포함하며, 미디어 이용자가 가지는 권리이다.", "w": ["틀린 설명. 알 권리는 자유권과 청구권의 성격을 모두 가진다.", "틀린 설명. 알 권리는 '미디어 이용자'의 권리이다. 보도 대상자는 인격권 등을 가진다.", "틀린 설명. 현대에는 국가가 수집한 정보를 공공재로 보고 개인이 적극 이용할 수 있다고 생각한다.", "옳은 설명(정답). 1996년 정보공개법을 제정했다."]}, {"p": "89", "s": "제1부 4장 미디어 관련 법제", "q": "인격권 보호와 관련된 설명으로 옳지 않은 것은?", "o": ["인격권은 헌법에 명시되어 있지 않지만, 일반적으로 헌법 제10조 인간의 존엄과 가치에서 도출된다.", "정보통신망법 제70조는 이른바 사이버 명예훼손죄를 규정한다.", "형법 제310조는 명예훼손 행위가 진실한 사실로서 오로지 공공의 이익에 관한 때에는 처벌하지 않는다고 규정한다.", "헌법재판소는 민법 제764조의 '명예회복에 적당한 처분'에 사죄광고를 포함시키는 것을 합헌이라고 보았다."], "a": 3, "e": "헌법재판소는 '명예회복에 적당한 처분'에 사죄광고를 포함시키는 것은 헌법에 위반된다고 판시했다(89헌마160).", "w": ["맞는 설명. 인격권은 헌법 제10조에서 도출된다고 보는 것이 일반적이다.", "맞는 설명. 정보통신망법 제70조가 사이버 명예훼손죄를 규정한다.", "맞는 설명. 형법 제310조의 위법성 조각 사유이다.", "틀린 설명(정답). 사죄광고를 포함시키는 것은 '위헌'으로 판시되었다."]}, {"p": "90", "s": "제1부 4장 미디어 관련 법제", "q": "구조 규율의 예로 교재에 제시된 내용으로 옳은 것은?", "o": ["외국인은 기간통신사업자 발행주식 총수의 100분의 30을 초과하여 소유할 수 없다.", "방송통신심의위원회의 심의규정 준수 의무는 구조 규율이다.", "누구든지 지상파방송사업자 및 종편·보도전문 PP의 주식 또는 지분 총수의 100분의 40을 초과하여 소유할 수 없다.", "정보통신망에서 음란 정보 유통 금지는 구조 규율이다."], "a": 2, "e": "구조 규율은 소유·운영·시장질서를 규율한다(방송법 제8조 지분 40% 제한, 전기통신사업법 외국인 지분 49% 제한). 심의규정과 음란정보 유통 금지는 내용 규율이다.", "w": ["오답. 외국 정부·외국인의 기간통신사업자 지분 한도는 '100분의 49'이다.", "오답. 심의규정 준수와 제재는 '내용 규율'의 예이다.", "정답. 방송법 제8조의 소유 제한이다.", "오답. 음란·명예훼손 정보 유통 금지는 '내용 규율'의 예이다."]}, {"p": "102", "s": "제1부 4장 미디어 관련 법제", "q": "인터넷 규제 방식에 대한 설명으로 옳지 않은 것은?", "o": ["인터넷은 개방성·탈중심성·국제성 때문에 법을 통한 정부규제에 한계가 있다.", "정보통신망법에는 자율규제에 관한 규정이 전혀 없다.", "자율규제는 빠르고 유연하게 대응할 수 있다.", "최근에는 자율규제와 정부규제를 조화시키는 공동규제(co-regulation)가 대세이다."], "a": 1, "e": "정보통신망법 제44조의4는 정보통신서비스 제공자단체가 행동강령과 자율규제 가이드라인을 정해 시행할 수 있게 하고, 정부가 이를 지원하도록 하여 공동규제를 예정한다.", "w": ["맞는 설명. 인터넷의 특성으로 정부규제에 한계가 있다.", "틀린 설명(정답). 정보통신망법 제44조의4가 자율규제를 명시하고 있다.", "맞는 설명. 자율규제는 빠르고 유연하며 기술 규제를 함께 할 수 있다.", "맞는 설명. 공동규제가 인터넷 규제의 대세를 이룬다."]}, {"p": "93", "s": "제1부 4장 미디어 관련 법제", "q": "산모의 생명이 위독해 낙태를 고려하는 경우처럼 산모와 태아의 생명권이 상충해 어느 한쪽을 희생할 수밖에 없을 때 적용하는 기본권 상충 해결 원칙은?", "o": ["명확성의 원칙", "대안식 해결방법", "실제적 조화의 원칙", "이익형량의 원칙"], "a": 3, "e": "양자택일 상황에서는 실제적 조화로 해결할 수 없으므로 어느 이익이 더 크고 중대한지 따지는 이익형량의 원칙을 따른다.", "w": ["오답. 명확성의 원칙은 기본권 제한 법률을 명확하게 규정하라는 원칙이다.", "오답. 대안식 해결방법은 실제적 조화의 원칙 안의 방법으로 두 기본권을 모두 다치지 않는 대안을 찾는다.", "오답. 실제적 조화의 원칙은 두 기본권을 모두 최대한 실현하도록 조정하는 원칙이라 양자택일 상황에는 적용하기 어렵다.", "정답. 양자택일 상황에서는 이익형량의 원칙에 따를 수밖에 없다."]}, {"p": "109", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "미디어교육을 '미디어의 긍정적 기능을 적극 발휘하기 위한 창조적 활용 교육과 역기능적 폐해를 최소화하기 위한 보호적 예방 교육'으로 정의한 학자는?", "o": ["버킹엄(2003)", "문혜성(2007)", "젠킨스(2006)", "김기태(2006)"], "a": 3, "e": "김기태(2006)의 정의는 미디어의 순기능을 살리고 역기능을 최소화하는 교육이라는 관점에 속한다. 같은 관점에 최창섭(2000), 이정춘(2004)이 있다.", "w": ["오답. 버킹엄은 '미디어에 대해 가르치고 배우는 과정'으로 정의했다.", "오답. 문혜성은 '인간이 성찰적으로 미디어를 활용하도록 이끄는 교육'으로 정의했다.", "오답. 젠킨스는 '참여문화'를 강조했다.", "정답. 창조적 활용 교육과 보호적 예방 교육을 함께 제시한 것은 김기태이다."]}, {"p": "111", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "리터러시의 종류와 설명의 연결로 옳지 않은 것은?", "o": ["데이터 리터러시 – 데이터를 수집·처리·분석·해석하고 사회적·윤리적 함의를 이해하는 능력", "정보 리터러시 – 도서관학과 문헌정보학에서 중요하게 다룬 개념", "게임 리터러시 – 게임을 잘하기 위한 조작 기술과 전략을 익히는 능력", "알고리즘 리터러시 – 알고리즘 작동 원리를 인식하고 그 결과를 비판적으로 분석하며 편향성과 프라이버시 문제를 인식하는 능력"], "a": 2, "e": "게임 리터러시는 게임의 구조·규칙·스토리텔링·디자인을 이해하고 비판적으로 분석하며 창작할 수 있는 능력이다.", "w": ["맞는 연결. 데이터 리터러시의 정의이다.", "맞는 연결. 정보 리터러시는 도서관학·문헌정보학에서 중요하게 다뤄졌다.", "틀린 연결(정답). 게임 리터러시는 게임을 이해·분석·창작하는 능력이지 조작 기술이 아니다.", "맞는 연결. 알고리즘 리터러시의 정의이다."]}, {"p": "118", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "유네스코(2016)의 MIL(미디어·정보 리터러시) 5대 법칙의 내용으로 옳지 않은 것은?", "o": ["MIL은 남녀노소를 불문하고 인권의 핵심이다.", "MIL은 한 번 교육받으면 완전히 습득되는 고정된 능력이다.", "미디어가 전달하는 정보와 메시지는 가치 중립적이지 않으며 편향될 수 있다.", "모든 시민은 정보·지식의 창출자이다."], "a": 1, "e": "법칙 5는 MIL이 한 번에 습득되지 않으며, 지식·기술·태도를 포함하는 지속적이고 역동적인 경험이라고 말한다.", "w": ["맞는 내용. 법칙 2에 포함된 내용이다.", "틀린 내용(정답). MIL은 한 번에 습득되지 않는 지속적·역동적 경험이다(법칙 5).", "맞는 내용. 법칙 3이다.", "맞는 내용. 법칙 2이다."]}, {"p": "113", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "정보 포화 환경에서 인간이 인식 체계를 인지적 노력이 필요 없는 '자동 조종 상태'로 만들며, 이것이 미디어가 우리 사고를 조종하게 허락하는 위험이라고 지적한 학자는?", "o": ["버킹엄(Buckingham)", "포터(Potter)", "리빙스턴(Livingstone)", "홉스(Hobbs)"], "a": 1, "e": "포터(2016)는 메시지의 자동 프로세싱 위험을 지적했다. 버킹엄은 미디어가 세상을 보는 투명한 창이 아니라 선택적 관점을 제공하는 '중재'라고 강조했다.", "w": ["오답. 버킹엄은 미디어가 '투명한 창'이 아니라 세상을 재현해 중재한다고 했다.", "정답. 자동 조종 상태(자동 프로세싱)의 위험을 지적한 것은 포터이다.", "오답. 리빙스턴은 미디어 리터러시가 창의성·연결성·커뮤니티 참여 능력을 발달시킨다고 강조했다.", "오답. 홉스는 디지털 및 미디어 문해력과 '만들며 배우기'를 강조했다."]}, {"p": "114-115", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "포터의 미디어 리터러시 발달 단계 중 '나에게 최선인 것'을 넘어 '어떤 메시지가 타인과 사회를 위해 최선인가'를 묻는 단계는?", "o": ["사회적 책임", "집중적 발달", "비판적 평가", "경험적 탐구"], "a": 0, "e": "미디어교육은 집중적 발달(정체) 단계를 넘어 경험적 탐구 → 비판적 평가 → 사회적 책임 단계로 나아가게 한다.", "w": ["정답. 사회를 위한 최선을 고민하는 것은 사회적 책임 단계이다.", "오답. 집중적 발달은 정보 유용성을 판단하지만 많은 사람이 머무는 정체 단계이다.", "오답. 비판적 평가는 메시지의 역사적·경제적·정치적·예술적 맥락을 이해하고 평가한다.", "오답. 경험적 탐구는 다양한 형식의 콘텐츠를 탐색하고 감성적·도덕적·미학적 반응을 추구한다."]}, {"p": "120", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "국회에 발의된 미디어교육 관련 법안의 '미디어교육 정의' 변화에 대한 설명으로 옳은 것은?", "o": ["2007년 이경숙 의원 법안부터 사회참여와 시민윤리의식이 포함되었다.", "2013년 김희정 의원 법안에서 이해와 활용 외에 '소통능력'이 추가되었다.", "2018년 신경민 의원 법안은 미디어 역기능 대응을 정의에서 제외했다.", "2021년 권인숙 의원 법안은 미디어에 관한 이해와 활용만을 목적으로 정의했다."], "a": 1, "e": "2007·2012년 법안은 이해와 활용 증진, 2013년에 소통능력 추가, 2018(신경민)·2020(정필모)년에 역기능 대응 포함, 2018(유은혜)·2021·2022년 법안은 접근·비판적 이해·활용·소통·사회참여·시민윤리의식을 포함했다.", "w": ["틀린 설명. 2007년 법안은 '건전한 이해와 활용 증진'만을 목적으로 했다.", "옳은 설명(정답). 2013년 김희정 의원 법안에서 소통능력이 추가되었다.", "틀린 설명. 신경민·정필모 의원 법안은 오히려 '역기능 대응'을 정의에 포함했다.", "틀린 설명. 권인숙 의원 법안은 접근·활용, 이해·비평, 민주적 소통, 시민윤리의식, 사회참여까지 포함했다."]}, {"p": "126", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "버킹엄이 제시한 핵심 영역별 탐구 질문 중 '누구의 목소리가 미디어에 반영되고, 누구의 목소리가 배제되는가?(접근과 참여)'는 어느 영역에 속하는가?", "o": ["미디어 제작", "미디어 수용자", "미디어 재현", "미디어 언어"], "a": 0, "e": "미디어 제작 영역의 질문은 테크놀로지, 전문 제작 영역, 미디어 산업, 미디어 간 연계, 규제, 유통과 보급, 접근과 참여이다.", "w": ["정답. '접근과 참여'는 미디어 제작 영역의 질문이다.", "오답. 수용자 영역은 목표 수용자, 지칭, 이용, 이해, 즐거움, 사회적 차이를 묻는다.", "오답. 재현 영역에도 '누가 이야기하고 누가 침묵하는가(존재와 부재)'가 있지만, '접근과 참여'라는 항목은 제작 영역에 있다.", "오답. 미디어 언어 영역은 의미·관행·코드·장르·선택·조합·테크놀로지를 묻는다."]}, {"p": "128", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "미디어 재현에 관한 교육의 핵심으로 가장 적절한 것은?", "o": ["미디어 기업의 소유 구조와 수익 모델을 분석하는 것", "미디어가 현실을 얼마나 정확하게 모사했는지 판단하는 것", "카메라와 편집 장비의 기술적 조작법을 익히는 것", "미디어가 현실을 어떻게 재해석하는지와 그 재현의 파급효과를 이해하는 것"], "a": 3, "e": "미디어는 선택·배제·강조를 통해 현실을 특정 방식으로 재현한다. 재현 교육의 핵심은 정확성 판정이 아니라 재해석 방식과 파급효과의 이해이다.", "w": ["오답. 소유 구조와 수익 모델은 '미디어 제작(산업)' 영역의 내용이다.", "오답. 교재는 정확한 모사 여부를 판단하는 것이 핵심이 '아니라고' 명시한다.", "오답. 기술적 조작법은 재현 교육의 핵심이 아니다.", "정답. 재해석 방식과 재현의 파급효과를 이해하는 것이 핵심이다."]}, {"p": "132", "s": "제2부 1장 미디어교육의 개념과 특징", "q": "대중예술 패러다임의 한계로 지적된 것은?", "o": ["미디어를 평가할 명확한 기준이 없어 가치 판단의 객관성과 일관성을 확보하기 어려웠고, 중산층 취향이 더 높게 평가되는 경향이 있었다.", "디지털 기술을 지나치게 강조했다.", "대중문화의 가치를 전혀 인정하지 않았다.", "미디어가 현실을 구성한다는 점만 강조해 예술적 가치를 무시했다."], "a": 0, "e": "대중예술 패러다임은 '좋은 것     <p class="lead">공부한 쪽수를 입력하면 전체 ${TOTAL}쪽 대비 공부한 비율만큼 10~100문항을 전체 문제 ${ALL.length}문항(3부 3장 수업 사례 등 실기 대비 문제 포함)에서 골라 냅니다. 쪽수가 많은 구간일수록 문제가 많이 나옵니다.</p>
    <label class="fl" for="pg">공부한 페이지<input class="inp" id="pg" autocomplete="off" placeholder="예: 1-60, 109-150" value="${esc(v)}"></label>
    <p class="calc" id="calc"></p>
    <label class="fl" id="cntw" for="cnt" hidden>문항 수 조정<span class="cnt"><input type="range" id="cnt" step="1"><output id="cntv"></output></span></label>
    <div class="row"><button class="btn" id="pgo" disabled>이 범위로 시작</button></div>
  </section>`;
}
function wireStudy(){
  const $ = id => document.getElementById(id), pg = $("pg"), calc = $("calc"), cnt = $("cnt"), cntw = $("cntw"), cntv = $("cntv"), go = $("pgo");
  let set = null;
  const upd = () => {
    set = parsePages(pg.value); calc.className = "calc"; cntw.hidden = true; go.disabled = true;
    if (!set) { calc.className = "calc err"; calc.textContent = "쪽수는 1-60, 109-150처럼 숫자와 범위로 적어 주세요."; return }
    if (!set.size) { calc.textContent = `교재 1~${TOTAL}쪽 중 공부한 쪽수를 입력하세요.`; return }
    const n = set.size, pct = Math.round(n / TOTAL * 100), rec = Math.max(10, Math.min(100, pct)), K = eligible(set).length;
    if (!K) { calc.className = "calc err"; calc.textContent = `${compress(set)}쪽만으로 풀 수 있는 문제가 아직 없습니다. 범위를 조금 넓혀 주세요.`; return }
    const max = Math.min(100, K), min = Math.min(10, K), val = Math.max(min, Math.min(max, rec));
    calc.textContent = `공부한 분량 ${n}쪽 · 전체 ${TOTAL}쪽의 ${pct}% → 권장 ${rec}문항` + (K < rec ? ` · 이 범위 문제가 ${K}개뿐이라 ${val}문항으로 진행합니다.` : ` · 이 범위에서 낼 수 있는 문제 ${K}개`);
    cnt.min = min; cnt.max = max; cnt.value = val; cntv.textContent = val + "문항"; cntw.hidden = min === max; go.disabled = false;
  };
  const start = () => {
    if (go.disabled) return;
    try { localStorage.setItem(PG, pg.value) } catch(e) {}
    useCustom({order: pickByPages(set, +cnt.value), i: 0, ans: {}, phase: "quiz", pages: compress(set)}); render(); window.scrollTo(0, 0);
  };
  pg.oninput = upd; cnt.oninput = () => { cntv.textContent = cnt.value + "문항" };
  go.onclick = start; pg.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); start() } };
  upd();
}
const CUR = KP + ":cur";
let cur = 0; try { cur = Math.min(+localStorage.getItem(CUR) || 0, SET.sets.length - 1) } catch(e) {}
let Q, KEY, st, custom = false;
const view = document.getElementById("view");
const fresh = () => ({order: Q.map((_, i) => i), i: 0, ans: {}, phase: "start"});
function useSet(n){
  custom = false; try { localStorage.removeItem(MODE) } catch(e) {}
  cur = n; Q = SET.sets[n].questions; KEY = KP + ":" + n;
  st = load() || fresh();
  try { localStorage.setItem(CUR, n) } catch(e) {}
  const sw = document.getElementById("switch");
  sw.hidden = SET.sets.length < 2;
  sw.textContent = `다른 문제 풀기 (${SET.sets[(n + 1) % SET.sets.length].name})`;
}
function switchSet(){ const back = custom; useSet(back ? cur : (cur + 1) % SET.sets.length); if (back) st.phase = "start"; render(); window.scrollTo(0, 0) }
document.getElementById("switch").onclick = switchSet;
let wasC = false; try { wasC = localStorage.getItem(MODE) === "c" } catch(e) {}
useSet(cur);
if (wasC) { try { const s = JSON.parse(localStorage.getItem(CK)); if (s && s.order) useCustom(s) } catch(e) {} }

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.order ? s : null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)) }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])) }
function meta(){
  const done = st.order.filter(k => k in st.ans).length, ok = st.order.filter(k => st.ans[k] === Q[k].a).length;
  document.getElementById("meta").textContent = `${custom ? "공부한 범위 학습" : SET.sets[cur].name} · ${done}/${st.order.length} 풀이 · 정답 ${ok}`;
  document.getElementById("bar").style.width = (done / st.order.length * 100) + "%";
}

function render(){
  meta(); save();
  if (st.phase === "start") return startView();
  if (st.phase === "result") return resultView();
  const k = st.order[st.i], q = Q[k], picked = st.ans[k], answered = picked !== undefined;
  view.innerHTML = `
    <div class="tag"><span class="qn">문제 ${st.i + 1} / ${st.order.length}</span><span>${esc(q.s)}</span><span>교재 ${esc(q.p)}쪽</span></div>
    <h2 class="q">${esc(q.q)}</h2>
    <div class="opts">${q.o.map((o, j) => `<button class="opt ${answered && j === q.a ? "correct" : ""} ${answered && j === picked && j !== q.a ? "wrong" : ""}" data-j="${j}" ${answered ? "disabled" : ""} id="opt${j}"><span class="n">${j + 1}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${answered ? `<div class="fb">
      <div class="verdict ${picked === q.a ? "ok" : "bad"}">${picked === q.a ? "정답입니다" : `오답입니다 · 정답은 ${N[q.a]}`}</div>
      <p class="exp"><b>해설</b> ${esc(q.e)}</p>
      ${q.w ? `<p class="sub">보기별 풀이</p><ul class="why">${q.w.map((w, j) => `<li class="${j === q.a ? "c" : ""} ${j === picked && j !== q.a ? "p" : ""}"><span class="n">${j + 1}</span><span>${esc(w)}${j === picked && j !== q.a ? " <b>← 내가 고른 답</b>" : ""}</span></li>`).join("")}</ul>` : ""}
      <div class="row">${st.i > 0 ? `<button class="btn ghost" id="prev">이전 문제</button>` : ""}<button class="btn" id="next">${st.i + 1 < st.order.length ? "다음 문제" : "결과 보기"}</button></div>
    </div>` : (st.i > 0 ? `<div class="row"><button class="btn ghost" id="prev">이전 문제</button></div>` : "")}`;
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.j));
  const n = document.getElementById("next"); if (n) { n.onclick = next; n.focus() }
  const p = document.getElementById("prev"); if (p) p.onclick = () => { st.i--; render() };
}
function pick(j){ const k = st.order[st.i]; if (k in st.ans) return; st.ans[k] = j; render() }
function next(){ if (st.i + 1 < st.order.length) { st.i++; render(); window.scrollTo(0, 0) } else { st.phase = "result"; render() } }

function startView(){
  const done = Object.keys(st.ans).length;
  view.innerHTML = `
    <h1>${esc(SET.title)} · ${esc(SET.sets[cur].name)}</h1>
    <p class="lead">2026년 실제 필기시험과 같은 구성(미디어 개론 25문항 + 미디어교육의 이론과 실제 25문항, 총 ${Q.length}문항)입니다. 실제 시험은 5지선다이며 필기 50문항과 실기(수업계획안) 1문항을 합쳐 100분 동안 봅니다. 답을 고르면 바로 정답, 해설, 보기별 풀이가 나오고 다음 버튼으로 다음 문제로 넘어갑니다.${SET.sets.length > 1 ? ` 모의고사는 ${SET.sets.length}개 세트(${SET.sets.map(s => esc(s.name)).join(", ")})가 있으며, 오른쪽 위의 '다른 문제 풀기'로 바꿀 수 있습니다.` : ""}</p>
    <div class="tw"><table><thead><tr><th>출제 단원</th><th class="r">문항</th></tr></thead><tbody>
      ${sections().map(([s, ks]) => `<tr><td>${esc(s)}</td><td class="r">${ks.length}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="row">
      ${done ? `<button class="btn ghost" id="resume">이어서 풀기 (${done}문항 완료)</button>` : ""}
      <button class="btn ghost" id="shuf">문제 순서 섞어서 시작</button>
      <button class="btn" id="go">처음부터 시작</button>
    </div>`;
  view.insertAdjacentHTML("beforeend", studyHTML()); wireStudy();
  document.getElementById("go").onclick = () => begin(false);
  document.getElementById("shuf").onclick = () => begin(true);
  const r = document.getElementById("resume"); if (r) r.onclick = () => { st.phase = "quiz"; render() };
}
function begin(shuffle, subset){
  const order = subset || Q.map((_, i) => i);
  if (shuffle) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]] }
  const ans = {}; if (subset) for (const k in st.ans) if (!subset.includes(+k)) ans[k] = st.ans[k];
  st = {order, i: 0, ans, phase: "quiz", pages: st.pages}; render();
}
function sections(){ const m = new Map(); Q.forEach((q, k) => { if (!m.has(q.s)) m.set(q.s, []); m.get(q.s).push(k) }); return [...m] }

function resultView(){
  const tot = st.order.length, ok = st.order.filter(k => st.ans[k] === Q[k].a).length, sc = Math.round(ok / tot * 100);
  const wrong = st.order.filter(k => st.ans[k] !== Q[k].a);
  const subj = [["미디어 개론", q => /^제1부/.test(q.s)], ["미디어교육의 이론과 실제", q => !/^제1부/.test(q.s)]].map(([n, f]) => { const ks = st.order.filter(k => f(Q[k])); return {n, t: ks.length, c: ks.filter(k => st.ans[k] === Q[k].a).length} }).filter(x => x.t);
  const ss = subj.map(x => Math.round(x.c / x.t * 100)), avg = ss.length ? Math.round(ss.reduce((p, v) => p + v, 0) / ss.length) : sc, pass = ss.every(v => v >= 40) && avg >= 60;
  const passTxt = subj.length === 2 ? `${subj.map((x, i) => `${x.n} ${ss[i]}점`).join(" · ")} · 평균 ${avg}점 → 필기 합격 기준 ${pass ? "충족" : "미달"} (과목별 40점 이상 · 평균 60점 이상)` : (sc >= 60 ? "60점 이상" : "60점 미만");
  view.innerHTML = `
    <div class="tag"><span>채점 결과</span></div>
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><div class="score">${sc}점</div><div class="lead">${tot}문항 중 ${ok}문항 정답 · ${passTxt}</div></div>
    <div class="tw"><table><thead><tr><th>단원</th><th class="r">정답</th><th class="r">정답률</th></tr></thead><tbody>
      ${sections().map(([s, ks]) => { const in_ = ks.filter(k => st.order.includes(k)); if (!in_.length) return ""; const c = in_.filter(k => st.ans[k] === Q[k].a).length; return `<tr><td>${esc(s)}</td><td class="r">${c}/${in_.length}</td><td class="r">${Math.round(c / in_.length * 100)}%</td></tr>` }).join("")}
    </tbody></table></div>
    <div><p class="lead" style="margin-bottom:8px">문항 번호를 누르면 해당 문제와 해설로 돌아갑니다.</p>
    <div class="grid">${st.order.map((k, i) => `<button class="cell ${st.ans[k] === Q[k].a ? "o" : "x"}" data-i="${i}" aria-label="문제 ${i + 1}">${i + 1}</button>`).join("")}</div></div>
    <div class="row">
      <button class="btn ghost" id="home">처음 화면</button>
      ${wrong.length ? `<button class="btn ${SET.sets.length > 1 ? "ghost" : ""}" id="redo">틀린 ${wrong.length}문항 다시 풀기</button>` : ""}
      ${SET.sets.length > 1 ? `<button class="btn" id="other">${custom ? "모의고사로 돌아가기" : `다른 문제 풀기 (${esc(SET.sets[(cur + 1) % SET.sets.length].name)})`}</button>` : ""}
    </div>`;
  const o = document.getElementById("other"); if (o) o.onclick = switchSet;
  view.querySelectorAll(".cell").forEach(b => b.onclick = () => { st.phase = "quiz"; st.i = +b.dataset.i; render() });
  document.getElementById("home").onclick = () => { if (custom) { try { localStorage.removeItem(CK) } catch(e) {} useSet(cur); st.phase = "start" } else st = fresh(); render() };
  const r = document.getElementById("redo"); if (r) r.onclick = () => begin(true, wrong);
}

document.addEventListener("keydown", e => {
  if (st.phase !== "quiz") return;
  if (/^[1-4]$/.test(e.key)) { const b = document.getElementById("opt" + (e.key - 1)); if (b && !b.disabled) b.click() }
  else if (e.key === "Enter" && document.activeElement?.id !== "next") { const n = document.getElementById("next"); if (n) { e.preventDefault(); n.click() } }
});
render();
</script>

</body></html>
